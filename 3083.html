<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store">
  <title>ラクア</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>

    body {
      margin: 0;
      font-family: sans-serif;
    }
    header {
      background-color: #333;
      color: white;
      display: flex;
      align-items: center;
      padding: 10px;
    }
    header img {
      height: 40px;
      margin-right: 10px;
      cursor: pointer;
    }
    header h1 {
      font-size: 1.2rem;
      margin: 0;
    }
    .menu-image {
      text-align: center;
      margin-bottom: 30px;
    }
    .menu-image img {
      max-width: 100%;
      height: auto;
    }
    .menu-header-images {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
    }
    .menu-header-images img {
      max-width: 45%;
      height: auto;
      border-radius: 8px;
    }
    #go-today {
      display: block;
      width: 90%;
      max-width: 400px;
      margin: 20px auto;
      padding: 1rem;
      font-size: 1.5rem;
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 8px;
      text-align: center;
      transition: transform 0.2s ease, background-color 0.3s;
    }
    #go-today:active {
      transform: scale(0.96);
      background-color: #1976D2;
    }
    .button-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }
    .sub-button {
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }
    .sub-button:active {
      background-color: #388E3C;
    }
    input[type="checkbox"] {
      display: none;
    }
    .actions-menu {
      position: fixed;
      width: 60px;
      height: 60px;
      right: 15px;
      bottom: 15px;
    }
    .btn {
      background: #e74c3c;
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .talk {
      color: red;
    }
    .btn--large {
      width: 60px;
      height: 60px;
      position: absolute;
      top: 0;
      left: 0;
    }
    .popup-flag {
      display: none;
    }

    .popup-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1001;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      z-index: 1002;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      width: 90%;
      max-width: 500px;
      box-sizing: border-box;
    }

    .popup-flag:checked + .popup-background {
      opacity: 1;
      visibility: visible;
    }

    .popup-flag:checked + .popup-background + .popup {
      opacity: 1;
      visibility: visible;
    }

    .close-button {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 24px;
      cursor: pointer;
      color: #333;
    }

    .popup .content {
      text-align: center;
    }

    .popup .content h3 {
      margin-top: 0;
      color: #4A6572;
      font-size: 1.8rem;
    }

    .popup .content h5 {
      color: #607D8B;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="talk">🚨プロジェクター表示のQRは非対応です。🚨</div>
  <button id="go-today">出席する</button>

  <div class="button-row">
    <button class="sub-button" onclick="location.href='https://cit.manaba.jp/ct/home/'">manaba</button>
    <button class="sub-button" onclick="location.href='https://portal.it-chiba.ac.jp/uprx/up/pk/pky001/Pky00101.xhtml/'">CITportal</button>
  </div>

  <div class="menu-header-images" id="menuHeaderImages" style="display: none;"></div>
  <h id="imageUpdateNote" style="display: none;">画像タップで最新画像に更新</h>

  <h1>今週の食堂メニュー</h1>
  <div id="menu1" class="menu-image"></div>
  <div id="menu2" class="menu-image"></div>
  <h>このサービスを利用したことによる利害について製作者は一切の責任をもちません。</h>

  <script>
    function getCurrentTimestamp() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const MM = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${yyyy}${MM}${dd}${hh}${mm}${ss}`;
    }

    function createReloadableImage(baseUrl) {
      const img = document.createElement("img");
      const updateSrc = () => {
        img.src = `${baseUrl}${getCurrentTimestamp()}`;
      };
      updateSrc();
      img.alt = "食堂ヘッダー画像";
      img.style.cursor = "pointer";
      img.addEventListener("click", updateSrc);
      return img;
    }

    function shouldShowMenuHeaderImages() {
      const now = new Date();
      const day = now.getDay(); // 日曜:0
      const hour = now.getHours();
      return day !== 0 && hour >= 11 && hour < 14;
    }

    if (shouldShowMenuHeaderImages()) {
      const headerImageContainer = document.getElementById("menuHeaderImages");
      headerImageContainer.style.display = "flex";
      headerImageContainer.appendChild(createReloadableImage("https://www.cit-s.com/i_catch/dining/narashino1.jpg?"));
      headerImageContainer.appendChild(createReloadableImage("https://www.cit-s.com/i_catch/dining/narashino2.jpg?"));
      document.getElementById("imageUpdateNote").style.display = "block";
    }

// ====================================
        // 🍔 メニュー画像再試行ロジック (ここから修正/追加)
        // ====================================

        // 既存のgetMenuURL関数を拡張し、週のオフセットを考慮できるようにします
        function getMenuURL(baseName, weekOffset = 0) {
            const today = new Date();
            const dayOfWeek = today.getDay();
            // 月曜日に設定
            const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            
            const monday = new Date(today);
            // weekOffsetを考慮: 1週間 = 7日
            monday.setDate(today.getDate() + diff + weekOffset * 7); 
            
            const year = monday.getFullYear();
            const month = monday.getMonth() + 1;
            const targetMonth = `${year}${String(month).padStart(2, '0')}`;
            
            // 週番号を計算
            // 修正後のgetMenuURLでは、weekOffsetによって日付が移動しているため、
            // その日付の属する週番号（月初から数えて何週目か）が取得されます。
            const weekNumber = Math.ceil(monday.getDate() / 7)+1;
            
            return `https://www.cit-s.com/wp/wp-content/themes/cit/menu/${baseName}_${targetMonth}_${weekNumber}.png`;
        }

        // 画像のロードを試行し、失敗した場合は週番号をインクリメントして再試行する関数
        function loadMenuImageWithRetry(elementId, baseName, retryCount = 0) {
            const maxRetries = 3; // 最大再試行回数 (今週 + 3週先まで)
            const container = document.getElementById(elementId);
            
            if (!container) return;

            // 以前の画像やコンテンツがあれば削除
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }

            const img = document.createElement("img");
            img.src = getMenuURL(baseName, retryCount); // retryCountが週のオフセットになる
            img.alt = `食堂メニュー ${baseName} (${retryCount}週目のURLを試行中)`;
            
            // 画像ロード失敗時の処理
            img.onerror = () => {
                if (retryCount < maxRetries) {
                    console.log(`[${baseName}] 画像ロード失敗: ${img.src}。次週を試行します (Retry ${retryCount + 1}/${maxRetries})。`);
                    // 次の週を試行
                    loadMenuImageWithRetry(elementId, baseName, retryCount + 1);
                } else {
                    console.error(`[${baseName}] 画像ロードに最大回数失敗しました。表示できません。`);
                    // 画像が見つからなかった場合の代替表示
                    container.innerHTML = `<p style="text-align: center; color: var(--color-dark); font-weight: 700; border: 4px dashed var(--color-dark); padding: 20px; border-radius: 10px; background-color: white; box-shadow: 8px 8px 0 var(--color-dark);">
                        今週のメニューは見つかりません。<br>(${baseName}: ${img.src}まで試行)</p>`;
                }
            };

            // 画像が成功した場合のonload処理 (特になし。DOMに追加)
            img.onload = () => {
                console.log(`[${baseName}] 画像ロード成功: ${img.src}`);
            };

            container.appendChild(img);
        }

        // メニュー画像のロードを実行
        let menu1 = {}; // グローバルスコープで再定義が必要だが、ここではローカル変数を置き換え
        let menu2 = {}; 
        loadMenuImageWithRetry("menu1", "sd1");
        loadMenuImageWithRetry("menu2", "sd2");

        // 既存の変数参照を維持するため、DOM要素から取得
        menu1 = document.getElementById("menu1").querySelector('img') || {src: ''};
        menu2 = document.getElementById("menu2").querySelector('img') || {src: ''};

    // VIPの授業予定データ
    const vipClasses = {
        0: [], // Sunday
        1: [],
        2: [ // Tuesday
            { start: 13, end: 14, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/1333" }
        ],
        3: [ // Wednesday
            { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7105" },
            { start: 12, end: 13, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7103" },
            { start: 14, end: 15, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7104" },
            { start: 17, end: 18, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/5109" }
        ],
        4: [ // Thursday
            { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7104" },
            { start: 11, end: 12, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/1102" }
        ],
        5: [ // Friday
            { start: 10, end: 11, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/5103" },
            { start: 13, end: 14, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7205" }
        ],
        6: []  // Saturday
    };

    // 既存のgo-todayイベントリスナーを削除 (もしあれば)
    const goTodayButton = document.getElementById("go-today");
    if (goTodayButton) {
      const oldEventListener = goTodayButton.__eventListener; // 以前設定したリスナーを識別するプロパティがあれば
      if (oldEventListener) {
        goTodayButton.removeEventListener("click", oldEventListener);
      } else {
        // 既存のリスナーが特定できない場合、イベントハンドラーを直接上書きする代替手段
        goTodayButton.onclick = null;
      }
    }

    // 新しいgo-todayイベントリスナーを設定
    const newGoTodayListener = () => {
        const now = new Date();
        const day = now.getDay(); // 0: Sunday, 1: Monday, ..., 6: Saturday
        const time = now.getHours() + now.getMinutes() / 60; // 現在時刻を少数で表現 (例: 9.5 は 9時30分)

        const todayVipClasses = vipClasses[day];
        let foundClass = null;

        for (const c of todayVipClasses) {
            // 授業開始前後30分までを判定範囲とする
            if (time >= (c.start - 0.5) && time <= (c.end + 0.5)) {
                foundClass = c;
                break;
            }
        }

        if (foundClass) {
            window.open(foundClass.url, '_blank'); // 新しいタブで開く
        } else {
            // 該当する授業がない場合は、従来の曜日ページに遷移
            const days = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
            const target = days[day];
            location.href = `${target}.html`;
        }
    };
    if (goTodayButton) {
      goTodayButton.addEventListener("click", newGoTodayListener);
      goTodayButton.__eventListener = newGoTodayListener; // 後で削除するためにリスナーを保存
    }


    document.addEventListener('DOMContentLoaded', () => {
        const popupFlag = document.getElementById('eventPopupFlag');
        if (!localStorage.getItem('eventPopupShown')) {
            popupFlag.checked = true;
            localStorage.setItem('eventPopupShown', 'true');
        }
    });
  </script>
</body>
</html>
