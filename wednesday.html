<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>水曜日</title>
  <link rel="stylesheet" href="style.css" /> </head>
<body>
  <header>
    <a href="index.html"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRy-TqUoSIxdkbPuooctOiqi5gifXDO0oV1bQ&s" alt="ホーム" /></a>
  </header>
  <h1>水曜日</h1>
  <a id="btn-com-ibu1" class="button hidden" href="https://attendance.is.it-chiba.ac.jp/attendance/class_room/8209" target="_blank">
    水12 異文化理解 須藤
  </a>
  <a id="btn-com-ibu2" class="button hidden" href="https://attendance.is.it-chiba.ac.jp/attendance/class_room/8206" target="_blank">
    水12 異文化理解 三浦
  </a>
  <a id="btn-com-ibu3" class="button hidden" href="https://attendance.is.it-chiba.ac.jp/attendance/class_room/8109" target="_blank">
    水12 異文化理解 木島
  </a>
  <a id="btn-com-ibu4" class="button hidden" href="https://attendance.is.it-chiba.ac.jp/attendance/class_room/5108" target="_blank">
    水12 異文化理解 仲町
  </a>
  <a id="btn-comp-pro" class="button hidden" href="https://attendance.is.it-chiba.ac.jp/attendance/class_room/1333" target="_blank">
    ※ 水5678 知能メディアプロジェクト1
  </a>
  <a id="btn-comp-chi" class="button hidden" href="https://attendance.is.it-chiba.ac.jp/attendance/class_room/5212" target="_blank">
    水910 言語と文化2 中国語 補習
  </a>
  <div id="no-class-msg" class="no-class hidden">現在出席できる授業はありません。</div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const now = new Date();
      const time = now.getHours() + now.getMinutes() / 60;

      const classes = [
        { btnId: 'btn-com-ibu1', start: 8.5, end: 10 },        
        { btnId: 'btn-com-ibu2', start: 8.5, end: 10 },        
        { btnId: 'btn-com-ibu3', start: 8.5, end: 10 },        
        { btnId: 'btn-com-ibu4', start: 8.5, end: 10 },
        { btnId: 'btn-comp-pro', start: 12.5, end: 16 },
        { btnId: 'btn-comp-chi', start: 16.5, end: 18 },
      ];

      let visibleCount = 0;

      classes.forEach(c => {
        const btn = document.getElementById(c.btnId);
        if (!btn) return;
        if (time >= c.start && time <= c.end) {
          btn.classList.remove('hidden');
          visibleCount++;
        } else {
          btn.classList.add('hidden');
        }
      });

      if (visibleCount === 0) {
        document.getElementById('no-class-msg').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
