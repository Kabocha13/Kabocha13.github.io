<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store">
  <title>ラクア - 知能メディア工学</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --color-bg: #f7f8fb;
      --color-surface: #ffffff;
      --color-text: #1f2937;
      --color-text-muted: #6b7280;
      --color-primary: #2563eb;
      --color-border: #e5e7eb;
      --shadow-soft: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Arial', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      padding-bottom: 48px;
      line-height: 1.6;
    }

    .talk {
      text-align: center;
      padding: 10px 16px;
      background-color: #fff7ed;
      color: #9a3412;
      border-bottom: 1px solid #fed7aa;
      font-size: 0.9rem;
    }

    header {
      background-color: var(--color-surface);
      display: flex;
      align-items: center;
      padding: 15px 20px;
      border-bottom: 1px solid var(--color-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.4rem;
      margin: 0;
      color: var(--color-primary);
      font-weight: 700;
    }

    h1 {
      text-align: center;
      margin: 36px 0 16px;
      color: var(--color-text);
      font-size: 1.35rem;
      font-weight: 600;
    }

    .menu-image {
      text-align: center;
      margin: 0 auto 30px;
      width: 90%;
      max-width: 600px;
      border-radius: 8px;
      padding: 12px;
      background-color: var(--color-surface);
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--color-border);
    }

    .menu-image img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }

    .menu-image p {
      color: var(--color-text-muted);
      border: 1px dashed #cbd5e1;
      padding: 24px 16px;
      border-radius: 6px;
      background-color: #f8fafc;
      margin: 0;
    }

    .menu-header-images {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 18px auto;
      padding: 12px;
      background-color: var(--color-surface);
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      box-sizing: border-box;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--color-border);
    }

    .menu-header-images img {
      max-width: 45%;
      height: auto;
      border-radius: 8px;
    }

    #imageUpdateNote {
      display: block;
      text-align: center;
      color: var(--color-text-muted);
      margin-top: -10px;
      margin-bottom: 30px;
      font-size: 0.8rem;
    }

    #go-today {
      display: block;
      width: 90%;
      max-width: 400px;
      margin: 36px auto 22px;
      padding: 1rem;
      font-size: 1.25rem;
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: 8px;
      text-align: center;
      font-weight: 700;
      box-shadow: var(--shadow-soft);
      transition: background-color 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }

    #go-today:hover {
      background-color: #1d4ed8;
    }

    #go-today:active {
      transform: scale(0.98);
    }

    .button-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 36px;
    }

    .sub-button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      background-color: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-weight: 500;
      transition: border-color 0.2s ease, color 0.2s ease;
      cursor: pointer;
    }

    .sub-button:hover {
      color: var(--color-primary);
      border-color: var(--color-primary);
    }

    .sub-button:active {
      transform: scale(0.95);
    }

    h {
      display: block;
      text-align: center;
      margin-top: 50px;
      padding: 20px;
      font-size: 0.75rem;
      color: var(--color-text-muted);
      border-top: 1px solid var(--color-border);
    }
  </style>
</head>
<body>
  <div class="talk">プロジェクター表示のQRは非対応です。</div>

  <button id="go-today">出席する</button>

  <div class="button-row">
    <button class="sub-button" onclick="location.href='https://cit.manaba.jp/ct/home/'">manaba</button>
    <button class="sub-button" onclick="location.href='https://portal.chibatech.ac.jp/uprx/up/pk/pky001/Pky00101.xhtml'">CITportal</button>
  </div>

  <div class="menu-header-images" id="menuHeaderImages" style="display: none;"></div>
  <h id="imageUpdateNote" style="display: none;">画像タップで最新画像に更新</h>

  <h1>今週の食堂メニュー</h1>
  <div id="menu1" class="menu-image">
    <img id="tsudanuma-menu" alt="津田沼食堂メニュー">
    <p id="menuNotFound" style="display: none;">今週のメニューは見つかりません。</p>
  </div>
  <h>このサービスを利用したことによる利害について製作者は一切の責任をもちません。</h>

  <script>
    function getCurrentTimestamp() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const MM = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${yyyy}${MM}${dd}${hh}${mm}${ss}`;
    }

    function createReloadableImage(baseUrl) {
      const img = document.createElement("img");
      const updateSrc = () => {
        img.src = `${baseUrl}${getCurrentTimestamp()}`;
      };
      updateSrc();
      img.alt = "食堂ヘッダー画像";
      img.style.cursor = "pointer";
      img.addEventListener("click", updateSrc);
      return img;
    }

    function shouldShowMenuHeaderImages() {
      const now = new Date();
      const day = now.getDay();
      const hour = now.getHours();
      return day !== 0 && hour >= 11 && hour < 14;
    }

    if (shouldShowMenuHeaderImages()) {
      const headerImageContainer = document.getElementById("menuHeaderImages");
      headerImageContainer.style.display = "flex";
      headerImageContainer.appendChild(createReloadableImage("https://www.cit-s.com/i_catch/dining/narashino1.jpg?"));
      document.getElementById("imageUpdateNote").style.display = "block";
    }

    function loadCafeteriaMenu() {
      const img = document.getElementById("tsudanuma-menu");
      const fallback = document.getElementById("menuNotFound");
      if (!img) return;

      const now = new Date();
      const pad = n => String(n).padStart(2, "0");
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const nm = month === 12 ? 1 : month + 1;
      const ny = month === 12 ? year + 1 : year;

      // 翌月1週目 → 今月5〜1週目の順に試し、最初に見つかった画像を表示
      const candidates = [
        `https://www.cit-s.com/wp/wp-content/themes/cit/menu/td_${ny}${pad(nm)}_1.png`,
        `https://www.cit-s.com/wp/wp-content/themes/cit/menu/td_${year}${pad(month)}_5.png`,
        `https://www.cit-s.com/wp/wp-content/themes/cit/menu/td_${year}${pad(month)}_4.png`,
        `https://www.cit-s.com/wp/wp-content/themes/cit/menu/td_${year}${pad(month)}_3.png`,
        `https://www.cit-s.com/wp/wp-content/themes/cit/menu/td_${year}${pad(month)}_2.png`,
        `https://www.cit-s.com/wp/wp-content/themes/cit/menu/td_${year}${pad(month)}_1.png`,
      ];

      function tryNext(i) {
        if (i >= candidates.length) {
          img.style.display = "none";
          if (fallback) fallback.style.display = "block";
          return;
        }

        const probe = new Image();
        probe.onload = function () {
          img.src = candidates[i];
          img.style.display = "inline";
          if (fallback) fallback.style.display = "none";
        };
        probe.onerror = function () {
          tryNext(i + 1);
        };
        probe.src = candidates[i];
      }

      tryNext(0);
    }

    loadCafeteriaMenu();

    const baseUrl = "https://attendance.is.it-chiba.ac.jp/attendance/class_room/";

    const vipClasses = {
      0: [],
      1: [
        { start: 8.0, end: 12.5, url: baseUrl + "635" },
        { start: 13.0, end: 15.5, url: baseUrl + "010201" }
      ],
      2: [
        { start: 8.0, end: 19.0, url: baseUrl + "635" }
      ],
      3: [
        { start: 8.0, end: 19.0, url: baseUrl + "431" }
      ],
      4: [
        { start: 8.0, end: 19.0, url: baseUrl + "632" }
      ],
      5: [
        { start: 8.0, end: 12.5, url: baseUrl + "632" },
        { start: 12.5, end: 19.0, url: baseUrl + "7111" },
      ],
      6: []
    };

    const goTodayButton = document.getElementById("go-today");
    if (goTodayButton) {
      const oldEventListener = goTodayButton.__eventListener;
      if (oldEventListener) {
        goTodayButton.removeEventListener("click", oldEventListener);
      } else {
        goTodayButton.onclick = null;
      }
    }

    const newGoTodayListener = () => {
      const now = new Date();
      const day = now.getDay();
      const time = now.getHours() + now.getMinutes() / 60;
      const todayVipClasses = vipClasses[day];
      let foundClass = null;

      for (const c of todayVipClasses) {
        if (time >= (c.start - 0.5) && time <= (c.end + 0.5)) {
          foundClass = c;
          break;
        }
      }

      if (foundClass) {
        window.open(foundClass.url, "_blank");
      } else {
        const days = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
        const target = days[day];
        location.href = `${target}.html`;
      }
    };

    if (goTodayButton) {
      goTodayButton.addEventListener("click", newGoTodayListener);
      goTodayButton.__eventListener = newGoTodayListener;
    }

  </script>
</body>
</html>
