<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store">
  <title>ラクア - 知能メディア工学</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /*
     * 🌐 INTELLIGENT MEDIA THEME STYLES 🌐
     * 都会的で洗練されたAI・データサイエンス風のダークテーマ
    */

    :root {
      --color-bg: #0F172A; /* 深いスレートブルー */
      --color-surface: #1E293B; /* 表面のパネル色 */
      --color-text: #F8FAFC; /* クリアなホワイト */
      --color-text-muted: #94A3B8; /* サブテキスト */
      --color-primary: #3B82F6; /* テックブルー */
      --color-accent: #8B5CF6; /* AI・メディアを象徴するパープル */
      --color-alert: #EF4444;
      --color-success: #10B981;
      
      --shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-glow: 0 0 15px rgba(59, 130, 246, 0.4);
      --shadow-glow-accent: 0 0 15px rgba(139, 92, 246, 0.4);
    }

    body {
      margin: 0;
      font-family: 'Inter', 'Helvetica Neue', 'Arial', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      padding-bottom: 80px;
      line-height: 1.6;
    }

    /* 🚨 警告バー 🚨 */
    .talk {
      text-align: center;
      padding: 12px;
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--color-alert);
      border-bottom: 1px solid rgba(239, 68, 68, 0.3);
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    /* 🖥️ ヘッダー 🖥️ */
    header {
      background-color: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      color: var(--color-text);
      display: flex;
      align-items: center;
      padding: 15px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 {
      font-size: 1.4rem;
      margin: 0;
      background: linear-gradient(to right, var(--color-primary), var(--color-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* 🖼️ メニュー画像コンテナ 🖼️ */
    h1 {
      text-align: center;
      margin: 40px 0 20px;
      color: var(--color-text);
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .menu-image {
      text-align: center;
      margin: 0 auto 30px;
      width: 90%;
      max-width: 600px;
      border-radius: 16px;
      padding: 15px;
      background-color: var(--color-surface);
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .menu-image img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .menu-image img:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-glow);
    }

    /* 📸 ヘッダー画像群 (ランチタイム表示) 📸 */
    .menu-header-images {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px auto;
      padding: 15px;
      background-color: var(--color-surface);
      border-radius: 16px;
      width: 90%;
      max-width: 600px;
      box-sizing: border-box;
      box-shadow: var(--shadow-soft);
    }
    .menu-header-images img {
      max-width: 45%;
      height: auto;
      border-radius: 8px;
    }
    #imageUpdateNote {
        display: block;
        text-align: center;
        color: var(--color-text-muted);
        margin-top: -10px;
        margin-bottom: 30px;
        font-size: 0.8rem;
    }

    /* 🔘 メインボタン: 出席する 🔘 */
    #go-today {
      display: block;
      width: 90%;
      max-width: 400px;
      margin: 40px auto;
      padding: 1.2rem;
      font-size: 1.5rem;
      background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
      color: white;
      border: none;
      border-radius: 16px;
      text-align: center;
      font-weight: 700;
      letter-spacing: 2px;
      box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
    }
    #go-today:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
    }
    #go-today:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 2px 10px rgba(59, 130, 246, 0.3);
    }

    /* ⚙️ サブボタン群 ⚙️ */
    .button-row {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 40px;
    }
    .sub-button {
      padding: 0.8rem 1.8rem;
      font-size: 1rem;
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--color-text);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-weight: 500;
      transition: all 0.3s ease;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }
    .sub-button:hover {
        background-color: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.2);
    }
    .sub-button:active {
      transform: scale(0.95);
    }

    /* ⚠️ 免責事項 ⚠️ */
    h {
      display: block;
      text-align: center;
      margin-top: 50px;
      padding: 20px;
      font-size: 0.75rem;
      color: var(--color-text-muted);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* 🔧 ポップアップ 🔧 */
    input[type="checkbox"] { display: none; }
    .popup-flag { display: none; }
    .popup-background {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1001;
      opacity: 0; visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .popup {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -45%);
      background: var(--color-surface);
      padding: 30px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      z-index: 1002;
      opacity: 0; visibility: hidden;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      width: 90%;
      max-width: 400px;
      box-sizing: border-box;
    }
    .popup-flag:checked + .popup-background { opacity: 1; visibility: visible; }
    .popup-flag:checked + .popup-background + .popup { 
        opacity: 1; 
        visibility: visible;
        transform: translate(-50%, -50%);
    }

    .close-button {
      position: absolute;
      top: 15px; right: 20px;
      font-size: 28px;
      cursor: pointer;
      color: var(--color-text-muted);
      transition: color 0.2s;
    }
    .close-button:hover { color: var(--color-text); }
    .popup .content { text-align: center; }
    .popup .content h3 {
      margin-top: 0;
      background: linear-gradient(to right, var(--color-primary), var(--color-accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.5rem;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .popup .content h5 {
      color: var(--color-text);
      font-size: 1.1rem;
      font-weight: 500;
      margin-top: 20px;
    }
    .popup .content p {
        color: var(--color-text-muted);
        font-size: 0.9rem;
    }

    /* 代替表示スタイル */
    .menu-image p {
      color: var(--color-text-muted) !important;
      font-weight: 500;
      border: 1px dashed rgba(255, 255, 255, 0.2) !important;
      padding: 30px 20px;
      border-radius: 12px;
      background-color: rgba(0, 0, 0, 0.2);
      box-shadow: none !important;
    }
  </style>
</head>
<body>
  <div class="talk">プロジェクター表示のQRは非対応です。</div>
  
  <button id="go-today">出席する</button>

  <div class="button-row">
    <button class="sub-button" onclick="location.href='https://cit.manaba.jp/ct/home/'">manaba</button>
    <button class="sub-button" onclick="location.href='https://portal.chibatech.ac.jp/uprx/up/pk/pky001/Pky00101.xhtml'">CITportal</button>
  </div>

  <div class="menu-header-images" id="menuHeaderImages" style="display: none;"></div>
  <h id="imageUpdateNote" style="display: none;">画像タップで最新画像に更新</h>

  <h1>今週の食堂メニュー</h1>
  <div id="menu1" class="menu-image"></div>
  <h>このサービスを利用したことによる利害について製作者は一切の責任をもちません。</h>

  <input type="checkbox" id="eventPopupFlag" class="popup-flag">
  <div class="popup-background"></div>
  <div class="popup">
    <label for="eventPopupFlag" class="close-button">&times;</label>
    <div class="content">
      <h3>SYSTEM UPDATE</h3>
      <h5>出席リンクが更新されました</h5>
      <p>「出席する」をタップして、現在の時間の講義ルームへ直接アクセスできます。</p>
    </div>
  </div>

  <script>
    function getCurrentTimestamp() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const MM = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${yyyy}${MM}${dd}${hh}${mm}${ss}`;
    }

    function createReloadableImage(baseUrl) {
      const img = document.createElement("img");
      const updateSrc = () => {
        img.src = `${baseUrl}${getCurrentTimestamp()}`;
      };
      updateSrc();
      img.alt = "食堂ヘッダー画像";
      img.style.cursor = "pointer";
      img.addEventListener("click", updateSrc);
      return img;
    }

    function shouldShowMenuHeaderImages() {
      const now = new Date();
      const day = now.getDay(); // 日曜:0
      const hour = now.getHours();
      return day !== 0 && hour >= 11 && hour < 14;
    }

    if (shouldShowMenuHeaderImages()) {
      const headerImageContainer = document.getElementById("menuHeaderImages");
      headerImageContainer.style.display = "flex";
      headerImageContainer.appendChild(createReloadableImage("https://www.cit-s.com/i_catch/dining/narashino1.jpg?"));
      document.getElementById("imageUpdateNote").style.display = "block";
    }

    function getMenuURL(baseName, targetDate) {
        const year = targetDate.getFullYear();
        const month = targetDate.getMonth() + 1;
        const targetMonth = `${year}${String(month).padStart(2, '0')}`;
        const dayOfMonth = targetDate.getDate();
        const firstDayOfMonth = new Date(targetDate.getFullYear(), targetDate.getMonth(), 1);
        const firstDayOfWeek = firstDayOfMonth.getDay(); 
        const firstDayDiffFromMonday = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1;
        let weekNumber = Math.ceil((dayOfMonth + firstDayDiffFromMonday) / 7);
        return `https://www.cit-s.com/wp/wp-content/themes/cit/menu/${baseName}_${targetMonth}_${weekNumber}.png`;
    }

    function loadMenuImageWithRetry(elementId, baseName, retryWeekOffset = 0) {
        const container = document.getElementById(elementId);
        if (!container) return;
        while (container.firstChild) {
            container.removeChild(container.firstChild);
        }
        
        const today = new Date();
        const currentMonth = today.getMonth();
        const currentYear = today.getFullYear();
        const firstDayOfMonth = new Date(currentYear, currentMonth, 1);
        const firstDayOfWeek = firstDayOfMonth.getDay(); 
        const firstDayDiffFromMonday = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1;
        const fifthMonday = new Date(firstDayOfMonth);
        fifthMonday.setDate(firstDayOfMonth.getDate() + 28 - firstDayDiffFromMonday);

        const targetDate = new Date(fifthMonday);
        targetDate.setDate(fifthMonday.getDate() - (retryWeekOffset * 7));
        
        const img = document.createElement("img");
        img.src = getMenuURL(baseName, targetDate);
        img.alt = `食堂メニュー ${baseName}`;
        
        const targetMonthVal = targetDate.getMonth();
        const targetYearVal = targetDate.getFullYear();
        const previousMonth = (currentMonth === 0) ? 11 : currentMonth - 1;
        const previousYear = (currentMonth === 0) ? currentYear - 1 : currentYear;

        let isWithinAllowedMonths = false;
        if (targetYearVal === currentYear && targetMonthVal === currentMonth) {
            isWithinAllowedMonths = true;
        } else if (targetYearVal === previousYear && targetMonthVal === previousMonth) {
            isWithinAllowedMonths = true;
        }

        img.onerror = () => {
            const nextRetryOffset = retryWeekOffset + 1;
            if (isWithinAllowedMonths) {
                loadMenuImageWithRetry(elementId, baseName, nextRetryOffset);
            } else {
                container.innerHTML = `<p>今週のメニューは見つかりません。<br>(${baseName}: 試行終了)</p>`;
            }
        };
        container.appendChild(img);
    }

    loadMenuImageWithRetry("menu1", "sd1");
    loadMenuImageWithRetry("menu2", "sd2");

    // ==========================================
    // 🏫 新しい時間割ロジック (知能メディア工学科)
    // ==========================================
    const baseUrl = "https://attendance.is.it-chiba.ac.jp/attendance/class_room/";
    
    // start, end は時間帯の幅を広く取っています（前後30分のマージン吸収用）
    const vipClasses = {
      0: [], // Sunday
      1: [ // Monday
        { start: 8.0, end: 12.5, url: baseUrl + "635" },     // 8:30 - 12:00
        { start: 13.0, end: 15.5, url: baseUrl + "010201" }  // 13:30 - 15:00
      ],
      2: [ // Tuesday (終日 635)
        { start: 8.0, end: 19.0, url: baseUrl + "635" }
      ],
      3: [ // Wednesday (終日 431)
        { start: 8.0, end: 19.0, url: baseUrl + "431" }
      ],
      4: [ // Thursday (終日 632)
        { start: 8.0, end: 19.0, url: baseUrl + "632" }
      ],
      5: [ // Friday
        { start: 8.0, end: 12.5, url: baseUrl + "632" },     // 午前
        { start: 12.5, end: 19.0, url: baseUrl + "7111" },   // 午後
      ],
      6: []  // Saturday
    };

    const goTodayButton = document.getElementById("go-today");
    if (goTodayButton) {
      const oldEventListener = goTodayButton.__eventListener; 
      if (oldEventListener) {
        goTodayButton.removeEventListener("click", oldEventListener);
      } else {
        goTodayButton.onclick = null;
      }
    }

    const newGoTodayListener = () => {
        const now = new Date();
        const day = now.getDay(); 
        const time = now.getHours() + now.getMinutes() / 60; 

        const todayVipClasses = vipClasses[day];
        let foundClass = null;

        for (const c of todayVipClasses) {
            // 前後30分(0.5)のマージンで該当授業を判定
            if (time >= (c.start - 0.5) && time <= (c.end + 0.5)) {
                foundClass = c;
                break;
            }
        }

        if (foundClass) {
            window.open(foundClass.url, '_blank'); 
        } else {
            const days = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
            const target = days[day];
            location.href = `${target}.html`;
        }
    };
    
    if (goTodayButton) {
      goTodayButton.addEventListener("click", newGoTodayListener);
      goTodayButton.__eventListener = newGoTodayListener; 
    }

    document.addEventListener('DOMContentLoaded', () => {
        const popupFlag = document.getElementById('eventPopupFlag');
        if (popupFlag && !localStorage.getItem('eventPopupShown')) {
            popupFlag.checked = true;
            localStorage.setItem('eventPopupShown', 'true');
        }
    });
  </script>
</body>
</html>
