<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store">
  <title>ラクア</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    /*
     * 🌃 CYBERPUNK THEME STYLES 🌃
     * Primary Color: Dark Blue/Gray (#1F2833)
     * Accent 1 (Neon): Cyan/Aqua (#66FCF1)
     * Accent 2 (Alert/Action): Magenta/Pink (#FF00A0)
     * Accent 3 (Success/Info): Lime Green (#4CAF50 -> #00FF00)
    */

    :root {
      --color-bg: #1F2833;
      --color-text: #C5C6C7;
      --color-neon-aqua: #66FCF1;
      --color-neon-pink: #FF00A0;
      --color-neon-red: #E74C3C;
      --color-neon-green: #00FF00;
      --shadow-neon-aqua: 0 0 5px var(--color-neon-aqua), 0 0 10px var(--color-neon-aqua);
      --shadow-neon-pink: 0 0 5px var(--color-neon-pink), 0 0 10px var(--color-neon-pink);
    }

    body {
      margin: 0;
      font-family: 'Consolas', 'Courier New', monospace, sans-serif; /* テクノロジー感のあるフォントを優先 */
      background-color: var(--color-bg);
      color: var(--color-text);
      padding-bottom: 80px; /* Floating menu space */
    }

    /* 🚨 警告バー 🚨 */
    .talk {
      text-align: center;
      padding: 10px;
      background-color: #3C003C; /* Dark Magenta Background */
      color: var(--color-neon-pink);
      border-bottom: 2px solid var(--color-neon-pink);
      text-shadow: 0 0 5px var(--color-neon-pink);
      font-weight: bold;
      animation: pulse-alert 1.5s infinite alternate;
    }

    @keyframes pulse-alert {
      from { box-shadow: 0 0 2px #FF00A0; }
      to { box-shadow: 0 0 10px #FF00A0; }
    }

    /* 🖥️ ヘッダー 🖥️ */
    header {
      background-color: #000; /* Super dark header */
      color: var(--color-neon-aqua);
      display: flex;
      align-items: center;
      padding: 15px 10px;
      border-bottom: 3px double var(--color-neon-aqua);
    }
    header img {
      height: 40px;
      margin-right: 10px;
      cursor: pointer;
      filter: drop-shadow(0 0 3px var(--color-neon-aqua)); /* Image neon glow */
    }
    header h1 {
      font-size: 1.5rem;
      margin: 0;
      text-shadow: var(--shadow-neon-aqua);
      letter-spacing: 2px;
    }

    /* 🖼️ メニュー画像コンテナ 🖼️ */
    h1 { /* 今週の食堂メニュー */
      text-align: center;
      margin: 30px 0 20px;
      color: var(--color-neon-aqua);
      text-shadow: var(--shadow-neon-aqua);
      font-size: 1.8rem;
    }
    .menu-image {
      text-align: center;
      margin-bottom: 40px;
      border: 1px solid #3A4B5C; /* Subtle border */
      padding: 10px;
      background-color: #2D3944;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
    .menu-image img {
      max-width: 100%;
      height: auto;
      border: 3px solid var(--color-neon-aqua); /* Neon frame */
      box-shadow: var(--shadow-neon-aqua);
      transition: all 0.3s;
    }
    .menu-image img:hover {
        box-shadow: 0 0 15px var(--color-neon-aqua), 0 0 25px var(--color-neon-aqua);
    }

    /* 📸 ヘッダー画像群 (ランチタイム表示) 📸 */
    .menu-header-images {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 30px auto;
      padding: 10px;
      background-color: #111;
      border: 1px dashed var(--color-neon-pink);
    }
    .menu-header-images img {
      max-width: 45%;
      height: auto;
      border-radius: 4px;
      border: 2px solid var(--color-neon-pink);
      box-shadow: var(--shadow-neon-pink);
    }
    #imageUpdateNote {
        display: block;
        text-align: center;
        color: var(--color-neon-pink);
        text-shadow: 0 0 3px var(--color-neon-pink);
        margin-top: -20px;
        margin-bottom: 20px;
        font-size: 0.9rem;
    }

    /* 🔘 メインボタン: 出席する 🔘 */
    #go-today {
      display: block;
      width: 90%;
      max-width: 400px;
      margin: 30px auto;
      padding: 1.5rem;
      font-size: 1.8rem;
      background-color: #00A0FF; /* Blue base */
      color: var(--color-bg);
      border: 4px solid var(--color-neon-aqua);
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      text-transform: uppercase;
      box-shadow: var(--shadow-neon-aqua);
      transition: all 0.3s ease;
      cursor: pointer;
    }
    #go-today:hover {
        background-color: #00C0FF;
        box-shadow: 0 0 10px var(--color-neon-aqua), 0 0 20px var(--color-neon-aqua);
    }
    #go-today:active {
      transform: scale(0.95);
      background-color: #0077AA;
      box-shadow: 0 0 5px var(--color-neon-aqua);
    }

    /* ⚙️ サブボタン群 ⚙️ */
    .button-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
      margin-bottom: 30px;
    }
    .sub-button {
      padding: 0.8rem 1.5rem;
      font-size: 1.1rem;
      background-color: #003300; /* Dark Green Base */
      color: var(--color-neon-green);
      border: 2px solid var(--color-neon-green);
      border-radius: 6px;
      transition: all 0.3s ease;
      box-shadow: 0 0 5px var(--color-neon-green);
      cursor: pointer;
    }
    .sub-button:hover {
        background-color: #005500;
        box-shadow: 0 0 10px var(--color-neon-green);
    }
    .sub-button:active {
      background-color: #002200;
      transform: translateY(2px);
      box-shadow: 0 0 3px var(--color-neon-green);
    }

    /* ⚠️ 免責事項 ⚠️ */
    h {
      display: block;
      text-align: center;
      margin-top: 30px;
      padding: 10px;
      font-size: 0.8rem;
      color: #777;
      border-top: 1px dotted #444;
    }

    /* 🔧 フローティングアクションメニュー 🔧 */
    input[type="checkbox"] {
      display: none;
    }
    .actions-menu {
      position: fixed;
      width: 60px;
      height: 60px;
      right: 15px;
      bottom: 15px;
      z-index: 999;
    }
    .btn {
      background: var(--color-neon-red);
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px var(--color-neon-red);
      transition: all 0.3s;
    }
    .btn--large {
      width: 60px;
      height: 60px;
      position: absolute;
      top: 0;
      left: 0;
      box-shadow: 0 0 10px var(--color-neon-red), 0 0 20px var(--color-neon-red);
    }

    /* 팝업 (Popup) */
    .popup-flag { display: none; }
    .popup-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9); /* Darker, more opaque background */
      z-index: 1001;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #0D1620; /* Pop-up background */
      padding: 30px;
      border-radius: 0; /* Sharp corners */
      border: 3px solid var(--color-neon-aqua);
      box-shadow: 0 0 15px var(--color-neon-aqua);
      z-index: 1002;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      width: 90%;
      max-width: 500px;
      box-sizing: border-box;
    }
    .popup-flag:checked + .popup-background { opacity: 1; visibility: visible; }
    .popup-flag:checked + .popup-background + .popup { opacity: 1; visibility: visible; }

    .close-button {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 30px;
      cursor: pointer;
      color: var(--color-neon-red); /* Neon red close button */
      text-shadow: 0 0 5px var(--color-neon-red);
    }
    .popup .content { text-align: center; }
    .popup .content h3 {
      margin-top: 0;
      color: var(--color-neon-pink);
      text-shadow: var(--shadow-neon-pink);
      font-size: 2rem;
      border-bottom: 1px dashed var(--color-neon-pink);
      padding-bottom: 10px;
    }
    .popup .content h5 {
      color: var(--color-neon-aqua);
      font-size: 1.3rem;
      margin-top: 15px;
    }

    /* メニュー画像が見つからなかった場合の代替表示のスタイル */
    .menu-image p {
      text-align: center;
      color: var(--color-neon-red) !important;
      font-weight: 700;
      border: 4px dashed var(--color-neon-red) !important;
      padding: 20px;
      border-radius: 10px;
      background-color: #2D3944;
      box-shadow: 0 0 10px var(--color-neon-red) !important;
      text-shadow: none;
    }
  </style>
</head>
<body>
  <div class="talk">🚨プロジェクター表示のQRは非対応です。🚨</div>
  <button id="go-today">出席する</button>

  <div class="button-row">
    <button class="sub-button" onclick="location.href='https://cit.manaba.jp/ct/home/'">manaba</button>
    <button class="sub-button" onclick="location.href='https://portal.it-chiba.ac.jp/uprx/up/pk/pky001/Pky00101.xhtml/'">CITportal</button>
  </div>

  <div class="menu-header-images" id="menuHeaderImages" style="display: none;"></div>
  <h id="imageUpdateNote" style="display: none;">画像タップで最新画像に更新</h>

  <h1>今週の食堂メニュー</h1>
  <div id="menu1" class="menu-image"></div>
  <div id="menu2" class="menu-image"></div>
  <h>このサービスを利用したことによる利害について製作者は一切の責任をもちません。</h>

  <input type="checkbox" id="eventPopupFlag" class="popup-flag">
  <div class="popup-background"></div>
  <div class="popup">
    <label for="eventPopupFlag" class="close-button">&times;</label>
    <div class="content">
      <h3>SYSTEM MESSAGE</h3>
      <h5>New feature: Attendance Link Updated.</h5>
      <p>Tap "出席する" to access your class attendance link immediately.</p>
    </div>
  </div>


  <script>
    // 💡 NOTE: The JavaScript logic remains completely untouched as per your request.

    function getCurrentTimestamp() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const MM = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${yyyy}${MM}${dd}${hh}${mm}${ss}`;
    }

    function createReloadableImage(baseUrl) {
      const img = document.createElement("img");
      const updateSrc = () => {
        img.src = `${baseUrl}${getCurrentTimestamp()}`;
      };
      updateSrc();
      img.alt = "食堂ヘッダー画像";
      img.style.cursor = "pointer";
      img.addEventListener("click", updateSrc);
      return img;
    }

    function shouldShowMenuHeaderImages() {
      const now = new Date();
      const day = now.getDay(); // 日曜:0
      const hour = now.getHours();
      return day !== 0 && hour >= 11 && hour < 14;
    }

    if (shouldShowMenuHeaderImages()) {
      const headerImageContainer = document.getElementById("menuHeaderImages");
      headerImageContainer.style.display = "flex";
      headerImageContainer.appendChild(createReloadableImage("https://www.cit-s.com/i_catch/dining/narashino1.jpg?"));
      headerImageContainer.appendChild(createReloadableImage("https://www.cit-s.com/i_catch/dining/narashino2.jpg?"));
      document.getElementById("imageUpdateNote").style.display = "block";
    }

// ====================================
// 🍔 食堂メニュー画像 URL 生成関数 (変更点)
// ====================================
/**
 * 指定された日付の食堂メニューURLを生成します。
 * 週番号は、月の最初の日を基準に計算されます。
 * @param {string} baseName - メニューのベース名 ("sd1" または "sd2")
 * @param {Date} targetDate - URLを生成したい週に含まれる日付 (通常は月曜日)
 * @returns {string} - 生成されたメニュー画像のURL
 */
function getMenuURL(baseName, targetDate) {
    const year = targetDate.getFullYear();
    const month = targetDate.getMonth() + 1; // 0-11 -> 1-12
    const targetMonth = `${year}${String(month).padStart(2, '0')}`;
    
    const dayOfMonth = targetDate.getDate();

    // targetDateの月の1日を取得
    const firstDayOfMonth = new Date(targetDate.getFullYear(), targetDate.getMonth(), 1);
    // 1日の曜日 (0:日曜, 1:月曜, ...)
    const firstDayOfWeek = firstDayOfMonth.getDay(); 
    
    // 週番号の計算（月の最初の日を起点として数える方式）
    // 月曜始まりとして調整 (1日が月曜であれば0、日曜であれば6)
    const firstDayDiffFromMonday = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1;
    
    // 週番号の計算: (日付 + 1日の月曜からのずれ) / 7 を切り上げ
    let weekNumber = Math.ceil((dayOfMonth + firstDayDiffFromMonday) / 7);

    return `https://www.cit-s.com/wp/wp-content/themes/cit/menu/${baseName}_${targetMonth}_${weekNumber}.png`;
}


// ====================================
// 🍔 画像のロードと遡り再試行ロジック (変更点)
// ====================================
/**
 * 食堂メニュー画像をロードし、失敗した場合は月をまたいで遡りながら再試行します。
 * 試行順: (今月の)第5週目 -> 第4週目 -> ... -> 第1週目 -> (前月の)第N週目
 * @param {string} elementId - 画像を挿入するDOM要素のID ("menu1" または "menu2")
 * @param {string} baseName - メニューのベース名 ("sd1" または "sd2")
 * @param {number} retryWeekOffset - 遡る週のオフセット (0: 第5週目から開始, 1: 第4週目, ...)
 */
function loadMenuImageWithRetry(elementId, baseName, retryWeekOffset = 0) {
    const container = document.getElementById(elementId);
    if (!container) return;

    // 以前の画像やコンテンツがあれば削除
    while (container.firstChild) {
        container.removeChild(container.firstChild);
    }
    
    // --- 試行対象日の決定ロジック ---
    const today = new Date();
    const currentMonth = today.getMonth();
    const currentYear = today.getFullYear();

    // 1. まず今月の1日を取得
    const firstDayOfMonth = new Date(currentYear, currentMonth, 1);
    
    // 2. 第5週目の月曜日を計算
    // 1日が月曜から数えて何日ずれているか (月曜(1)を0とする)
    const firstDayOfWeek = firstDayOfMonth.getDay(); 
    const firstDayDiffFromMonday = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1;
    
    // 第5週目の月曜日 (1日 + 4週間分(28日) - 1日の月曜との差)
    const fifthMonday = new Date(firstDayOfMonth);
    fifthMonday.setDate(firstDayOfMonth.getDate() + 28 - firstDayDiffFromMonday);

    // 3. 試行対象日を計算: 第5週の月曜日から `retryWeekOffset` 週分遡る
    const targetDate = new Date(fifthMonday);
    targetDate.setDate(fifthMonday.getDate() - (retryWeekOffset * 7));
    
    // 4. URLを生成
    const img = document.createElement("img");
    img.src = getMenuURL(baseName, targetDate);
    img.alt = `食堂メニュー ${baseName} (遡り ${retryWeekOffset} 週目のURLを試行中 - ${targetDate.toLocaleDateString()})`;
    
    // --- 試行継続の条件チェック ---
    // 試行対象日が前々月以前ではないかチェック (今月 or 前月までOK)
    const targetMonth = targetDate.getMonth();
    const targetYear = targetDate.getFullYear();
    
    // 前月の月番号
    const previousMonth = (currentMonth === 0) ? 11 : currentMonth - 1;
    const previousYear = (currentMonth === 0) ? currentYear - 1 : currentYear;

    // 試行対象日が「今月」または「前月」の範囲内であるか
    let isWithinAllowedMonths = false;
    if (targetYear === currentYear && targetMonth === currentMonth) {
        isWithinAllowedMonths = true; // 今月
    } else if (targetYear === previousYear && targetMonth === previousMonth) {
        isWithinAllowedMonths = true; // 前月
    }

    // 画像ロード失敗時の処理
    img.onerror = () => {
        const nextRetryOffset = retryWeekOffset + 1;
        
        // 次の試行が許容範囲内であれば再試行
        if (isWithinAllowedMonths) {
            // 次の週を試行
            console.log(`[${baseName}] 画像ロード失敗: ${img.src}。前週を試行します (遡り ${nextRetryOffset})。`);
            loadMenuImageWithRetry(elementId, baseName, nextRetryOffset);
        } else {
            console.error(`[${baseName}] 画像ロードに最大回数失敗しました、または前々月以前に達しました。表示できません。`);
            // 画像が見つからなかった場合の代替表示
            container.innerHTML = `<p style="text-align: center; color: var(--color-dark); font-weight: 700; border: 4px dashed var(--color-dark); padding: 20px; border-radius: 10px; background-color: white; box-shadow: 8px 8px 0 var(--color-dark);">
                今週のメニューは見つかりません。<br>(${baseName}: 試行終了)</p>`;
        }
    };

    // 画像が成功した場合のonload処理
    img.onload = () => {
        console.log(`[${baseName}] 画像ロード成功: ${img.src}`);
    };

    container.appendChild(img);
}

// メニュー画像のロードを実行
loadMenuImageWithRetry("menu1", "sd1");
loadMenuImageWithRetry("menu2", "sd2");

// 既存の変数参照を維持するため、DOM要素から取得
let menu1 = document.getElementById("menu1").querySelector('img') || {src: ''};
let menu2 = document.getElementById("menu2").querySelector('img') || {src: ''};
    // VIPの授業予定データ
    const vipClasses = {
      0: [], // Sunday
      1: [ // Monday
        { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/1251" },
        { start: 14, end: 15, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/8102" }
      ],
      2: [ // Tuesday
        { start: 13, end: 14, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/1333" }
      ],
      3: [ // Wednesday
        { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7105" },
        { start: 12, end: 13, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7103" },
        { start: 14, end: 15, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7104" }
      ],
      4: [ // Thursday
        { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7104" },
        { start: 11, end: 12, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/1102" }
      ],
      5: [ // Friday
        { start: 13, end: 14, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/8201" },
        { start: 15, end: 16, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/5211" },
      ],
      6: []  // Saturday
    };

    const goTodayButton = document.getElementById("go-today");
    if (goTodayButton) {
      const oldEventListener = goTodayButton.__eventListener; 
      if (oldEventListener) {
        goTodayButton.removeEventListener("click", oldEventListener);
      } else {
        goTodayButton.onclick = null;
      }
    }

    const newGoTodayListener = () => {
        const now = new Date();
        const day = now.getDay(); 
        const time = now.getHours() + now.getMinutes() / 60; 

        const todayVipClasses = vipClasses[day];
        let foundClass = null;

        for (const c of todayVipClasses) {
            if (time >= (c.start - 0.5) && time <= (c.end + 0.5)) {
                foundClass = c;
                break;
            }
        }

        if (foundClass) {
            window.open(foundClass.url, '_blank'); 
        } else {
            const days = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
            const target = days[day];
            location.href = `${target}.html`;
        }
    };
    if (goTodayButton) {
      goTodayButton.addEventListener("click", newGoTodayListener);
      goTodayButton.__eventListener = newGoTodayListener; 
    }


    document.addEventListener('DOMContentLoaded', () => {
        const popupFlag = document.getElementById('eventPopupFlag');
        if (popupFlag && !localStorage.getItem('eventPopupShown')) {
            popupFlag.checked = true;
            localStorage.setItem('eventPopupShown', 'true');
        }
    });
  </script>
</body>
</html>
