<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store">
    <title>盟主 ラクア - GATEWAY</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>

        /* 近未来/SF風デザインの基調色 */
        :root {
            --sf-main: #00FFFF; /* Electric Cyan (メインネオン) */
            --sf-dark: #0A1929; /* Deep Space Blue (背景) */
            --sf-accent: #39FF14; /* Cyber Green (アクセント) */
            --sf-text-light: #F0F8FF; /* Off-White */
            --sf-text-secondary: #007777; /* Dim Cyan */
            --sf-shadow-main: 0 0 15px var(--sf-main), 0 0 5px var(--sf-main);
            --sf-shadow-accent: 0 0 10px var(--sf-accent);
        }

        /* -------------------------
           1. 基本設定とアニメーション
           ------------------------- */
        body {
            margin: 0;
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--sf-dark);
            color: var(--sf-text-light);
            overflow-x: hidden;
            /* グリッド風の背景アニメーション */
            background-image: linear-gradient(0deg, var(--sf-dark) 90%, var(--sf-text-secondary) 100%);
            background-size: 100% 50px;
            animation: moveGrid 60s linear infinite;
        }

        @keyframes moveGrid {
            from { background-position-y: 0; }
            to { background-position-y: 100%; }
        }

        /* 全体的なフェードインアニメーション */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        .loaded .fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        /* -------------------------
           2. ヘッダー
           ------------------------- */
        header {
            background-color: rgba(10, 25, 41, 0.8); /* 半透明化 */
            backdrop-filter: blur(5px); /* 背景のぼかし */
            display: flex;
            align-items: center;
            padding: 15px 10px;
            box-shadow: var(--sf-shadow-main);
            border-bottom: 2px solid var(--sf-main);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header .material-icons {
            font-size: 40px;
            margin-right: 15px;
            color: var(--sf-accent);
            text-shadow: var(--sf-shadow-accent);
        }
        header h1 {
            font-family: 'Orbitron', sans-serif; /* SFタイトルフォント */
            font-size: 1.6rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--sf-main);
            text-shadow: var(--sf-shadow-main);
        }

        /* -------------------------
           3. タイトルと警告
           ------------------------- */
        h1.section-title {
            text-align: center;
            font-size: 1.8rem;
            color: var(--sf-main);
            margin: 40px 0 20px;
            border-bottom: 2px solid var(--sf-accent);
            display: inline-block;
            padding-bottom: 5px;
            width: 80%;
            max-width: 400px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            font-family: 'Orbitron', sans-serif;
            text-shadow: var(--sf-shadow-main);
        }

        .talk { /* 警告バー */
            color: var(--sf-accent);
            text-align: center;
            font-weight: 700;
            padding: 10px 0;
            background-color: rgba(57, 255, 20, 0.1);
            border: 1px solid var(--sf-accent);
            margin-bottom: 15px;
            text-shadow: 0 0 5px var(--sf-accent);
            animation: blink 3s linear infinite; /* 点滅アニメーション */
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #imageUpdateNote {
            color: var(--sf-accent);
            font-size: 0.9rem;
            text-shadow: 0 0 5px var(--sf-accent);
        }

        h { /* 最後の責任免除のテキスト */
            display: block;
            text-align: center;
            font-size: 0.8rem;
            color: #696969;
            margin-top: 30px;
            padding-bottom: 20px;
            font-family: 'Rajdhani', sans-serif;
        }

        /* -------------------------
           4. ボタン
           ------------------------- */
        .cyber-button {
            display: block;
            margin: 25px auto;
            padding: 1.2rem;
            font-size: 1.6rem;
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid var(--sf-main);
            background-color: rgba(0, 255, 255, 0.1);
            color: var(--sf-main);
            transition: all 0.3s ease;
            box-shadow: var(--sf-shadow-main);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        /* メインボタン */
        #go-today {
            width: 90%;
            max-width: 450px;
        }
        #go-today:hover {
            transform: scale(1.03);
            background-color: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 30px var(--sf-main), 0 0 10px var(--sf-main);
        }
        #go-today:active {
            transform: scale(0.98);
            background-color: rgba(0, 255, 255, 0.5);
            box-shadow: none;
        }
        /* グリッチアニメーション */
        @keyframes glitch {
            0% { text-shadow: 2px 2px var(--sf-accent), -2px -2px var(--sf-main); }
            10% { text-shadow: -2px -2px var(--sf-accent), 2px 2px var(--sf-main); }
            20% { text-shadow: 4px 0 var(--sf-accent), -4px 0 var(--sf-main); }
            30% { text-shadow: 0 4px var(--sf-accent), 0 -4px var(--sf-main); }
            100% { text-shadow: none; }
        }
        .glitch-active {
            animation: glitch 0.2s linear 5, none 0.5s;
        }

        /* サブボタン */
        .button-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .sub-button {
            padding: 0.8rem 1.2rem;
            font-size: 1.1rem;
            background-color: rgba(57, 255, 20, 0.1);
            color: var(--sf-accent);
            border: 1px solid var(--sf-accent);
            box-shadow: var(--sf-shadow-accent);
            transition: all 0.3s ease;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
        }
        .sub-button:hover {
            background-color: rgba(57, 255, 20, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 0 20px var(--sf-accent);
        }
        .sub-button:active {
            transform: translateY(0);
        }

        /* -------------------------
           5. 画像とメニュー
           ------------------------- */
        .menu-image, .menu-header-images img {
            max-width: 95%;
            height: auto;
            border: 2px solid var(--sf-main);
            box-shadow: var(--sf-shadow-main);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .menu-image {
            text-align: center;
            margin-bottom: 30px;
        }
        .menu-image img {
            max-width: 100%;
            display: block;
            margin: auto;
            cursor: pointer;
        }
        .menu-header-images {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            padding: 0 10px;
        }
        .menu-header-images img {
            max-width: 48%;
            cursor: pointer;
        }
        .menu-image img:hover, .menu-header-images img:hover {
            transform: scale(1.01);
            box-shadow: 0 0 30px var(--sf-main), 0 0 10px var(--sf-main);
        }


        /* -------------------------
           6. ポップアップ
           ------------------------- */
        .popup-flag { display: none; }

        .popup-background {
            background: rgba(0, 0, 0, 0.9);
            transition: opacity 0.5s ease;
        }

        .popup {
            background: var(--sf-dark);
            border: 3px solid var(--sf-main);
            box-shadow: 0 0 20px var(--sf-main);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease, transform 0.5s ease;
            transform: translate(-50%, -50%) scale(0.8);
            width: 90%;
            max-width: 450px;
        }

        .popup-flag:checked + .popup-background {
            opacity: 1;
            visibility: visible;
        }

        .popup-flag:checked + .popup-background + .popup {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
            animation: popupGlitch 0.3s linear;
        }
        @keyframes popupGlitch {
            0% { transform: translate(-50%, -50%) scale(1) skew(5deg, 5deg); }
            25% { transform: translate(-50%, -50%) scale(1.05) skew(-5deg, -5deg); }
            50% { transform: translate(-50%, -50%) scale(1) skew(2deg, 2deg); }
            75% { transform: translate(-50%, -50%) scale(1.03) skew(-2deg, -2deg); }
            100% { transform: translate(-50%, -50%) scale(1) skew(0, 0); }
        }

        .close-button {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 30px;
            color: var(--sf-accent);
            cursor: pointer;
            text-shadow: var(--sf-shadow-accent);
            transition: transform 0.2s;
        }
        .close-button:hover {
            transform: rotate(90deg) scale(1.2);
        }

        .popup .content h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--sf-main);
            font-size: 2rem;
            text-shadow: var(--sf-shadow-main);
            border-bottom: 2px dashed var(--sf-accent);
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .popup .content h5 {
            color: var(--sf-text-light);
            font-size: 1.3rem;
            line-height: 1.6;
        }

        /* -------------------------
           7. FAB (フローティングボタン)
           ------------------------- */
        .actions-menu {
            position: fixed;
            width: 60px;
            height: 60px;
            right: 20px;
            bottom: 20px;
            z-index: 50;
        }
        .btn--large {
            background: var(--sf-accent);
            width: 60px;
            height: 60px;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--sf-accent);
            transition: all 0.3s ease;
            animation: pulse 2s infinite; /* 脈動アニメーション */
            border-radius: 50%; /* 円形維持 */
        }
        .btn--large:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px var(--sf-accent);
        }
        .btn--large .material-icons {
            font-size: 30px;
            color: var(--sf-dark);
            text-shadow: 0 0 5px var(--sf-text-light);
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 10px var(--sf-accent); }
            50% { box-shadow: 0 0 30px var(--sf-accent); }
            100% { box-shadow: 0 0 10px var(--sf-accent); }
        }

    </style>
</head>
<body class="loaded">
    <header>
        <span class="material-icons" style="font-size: 45px;">data_usage</span>
        <h1>盟主 ラクアの「智慧之王」</h1>
    </header>
    <div class="talk fade-in" style="transition-delay: 0.2s;">🚨認証エラー: プロジェクター表示のQRは非対応です。🚨</div>
    
    <button id="go-today" class="cyber-button fade-in" style="transition-delay: 0.4s;">
        <span class="button-text">アクセスコード認証 (自動誘導)</span>
    </button>

    <div class="button-row fade-in" style="transition-delay: 0.6s;">
        <button class="sub-button" onclick="location.href='https://cit.manaba.jp/ct/home/'">manaba_LINK</button>
        <button class="sub-button" onclick="location.href='https://portal.it-chiba.ac.jp/uprx/up/pk/pky001/Pky00101.xhtml/'">CITportal_LINK</button>
    </div>

    <div class="menu-header-images" id="menuHeaderImages" style="display: none;"></div>
    <h id="imageUpdateNote" style="display: none;">画像タップで「大賢者」が最新画像に更新します</h>

    <h1 class="section-title fade-in" style="transition-delay: 0.8s;">今週の食堂メニュー (食事供給スキル)</h1>
    <div id="menu1" class="menu-image fade-in" style="transition-delay: 1.0s;"></div>
    <div id="menu2" class="menu-image fade-in" style="transition-delay: 1.2s;"></div>
    <h class="fade-in" style="transition-delay: 1.4s;">このサービスを利用したことによる利害について製作者は一切の責任をもちません。</h>

    <input type="checkbox" id="eventPopupFlag" class="popup-flag" />
    <label for="eventPopupFlag" class="popup-background"></label>
    <div class="popup">
        <label for="eventPopupFlag" class="close-button">&times;</label>
        <div class="content">
            <h3>【盟主からのお知らせ - DATA_LOG_001】</h3>
            <h5>リムル様より... システム起動ログを確認してください。</h5>
        </div>
    </div>


    <script>
        // ----------------------------------------------------
        // 既存の機能はそのまま保持
        // ----------------------------------------------------
        function getCurrentTimestamp() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const MM = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            return `${yyyy}${MM}${dd}${hh}${mm}${ss}`;
        }

        function createReloadableImage(baseUrl) {
            const img = document.createElement("img");
            const updateSrc = () => {
                // 画像をリロードする前にグリッチエフェクトを追加
                img.classList.add('glitch-active');
                setTimeout(() => {
                    img.src = `${baseUrl}${getCurrentTimestamp()}`;
                    img.classList.remove('glitch-active');
                }, 300); // グリッチ時間
            };
            updateSrc();
            img.alt = "食堂ヘッダー画像";
            img.style.cursor = "pointer";
            img.addEventListener("click", updateSrc);
            return img;
        }

        function shouldShowMenuHeaderImages() {
            const now = new Date();
            const day = now.getDay();
            const hour = now.getHours();
            // 月曜日から金曜日 (1-5) の 11時〜13時台 (11:00-13:59)
            return day >= 1 && day <= 5 && hour >= 11 && hour < 14;
        }

        if (shouldShowMenuHeaderImages()) {
            const headerImageContainer = document.getElementById("menuHeaderImages");
            headerImageContainer.style.display = "flex";
            headerImageContainer.appendChild(createReloadableImage("https://www.cit-s.com/i_catch/dining/narashino1.jpg?"));
            headerImageContainer.appendChild(createReloadableImage("https://www.cit-s.com/i_catch/dining/narashino2.jpg?"));
            document.getElementById("imageUpdateNote").style.display = "block";
        }

        function getMenuURL(baseName) {
            const today = new Date();
            const dayOfWeek = today.getDay();
            const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            const monday = new Date(today);
            monday.setDate(today.getDate() + diff);
            const year = monday.getFullYear();
            const month = monday.getMonth() + 1;
            const targetMonth = `${year}${String(month).padStart(2, '0')}`;
            const weekNumber = Math.ceil(monday.getDate() / 7);
            return `https://www.cit-s.com/wp/wp-content/themes/cit/menu/${baseName}_${targetMonth}_${weekNumber}.png`;
        }

        const menu1Container = document.getElementById("menu1");
        const menu1 = document.createElement("img");
        menu1.src = getMenuURL("sd1");
        menu1.alt = "食堂メニュー1";
        // 画像をタップでリロード
        menu1.addEventListener('click', () => {
             // リロードと同時にグリッチアニメーション
            menu1.classList.add('glitch-active');
            setTimeout(() => {
                menu1.src = getMenuURL("sd1") + '?' + getCurrentTimestamp();
                menu1.classList.remove('glitch-active');
            }, 300);
        });
        menu1Container.appendChild(menu1);

        const menu2Container = document.getElementById("menu2");
        const menu2 = document.createElement("img");
        menu2.src = getMenuURL("sd2");
        menu2.alt = "食堂メニュー2";
        // 画像をタップでリロード
        menu2.addEventListener('click', () => {
            // リロードと同時にグリッチアニメーション
            menu2.classList.add('glitch-active');
            setTimeout(() => {
                menu2.src = getMenuURL("sd2") + '?' + getCurrentTimestamp();
                menu2.classList.remove('glitch-active');
            }, 300);
        });
        menu2Container.appendChild(menu2);


        // VIPの授業予定データ
        const vipClasses = {
            0: [], 
            1: [ 
                { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/1251" }
            ],
            2: [ 
                { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/5301" },
                { start: 13, end: 14, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/1333" }
            ],
            3: [ 
                { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7105" },
                { start: 12, end: 13, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7103" },
                { start: 14, end: 15, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7104" }
            ],
            4: [ 
                { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7104" },
                { start: 11, end: 12, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/1102" }
            ],
            5: [ 
                { start: 13, end: 14, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7205" }
            ],
            6: [] 
        };

        // 新しいgo-todayイベントリスナーを設定
        const goTodayButton = document.getElementById("go-today");
        const newGoTodayListener = () => {
            // ボタン押下時にグリッチアニメーションを発動
            const buttonText = goTodayButton.querySelector('.button-text');
            if (buttonText) {
                buttonText.classList.add('glitch-active');
            }

            // 0.5秒後に本来の処理を実行
            setTimeout(() => {
                if (buttonText) {
                    buttonText.classList.remove('glitch-active');
                }
                
                const now = new Date();
                const day = now.getDay();
                const time = now.getHours() + now.getMinutes() / 60;

                const todayVipClasses = vipClasses[day];
                let foundClass = null;

                for (const c of todayVipClasses) {
                    // 授業開始前後30分までを判定範囲とする
                    if (time >= (c.start - 0.5) && time <= (c.end + 0.5)) {
                        foundClass = c;
                        break;
                    }
                }

                if (foundClass) {
                    window.open(foundClass.url, '_blank');
                } else {
                    const days = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
                    const target = days[day];
                    location.href = `${target}.html`;
                }
            }, 500); // グリッチ時間
        };

        // 既存のイベントリスナーがあれば削除
        if (goTodayButton) {
            goTodayButton.onclick = null; // onclickプロパティをクリア
            goTodayButton.removeEventListener("click", goTodayButton.__eventListener); // 保存したリスナーを削除
        }
        
        // ボタンのテキストを囲むspanを挿入
        if (goTodayButton && !goTodayButton.querySelector('.button-text')) {
            const text = goTodayButton.textContent;
            goTodayButton.innerHTML = `<span class="button-text">${text}</span>`;
        }

        // 新しいイベントリスナーを設定
        if (goTodayButton) {
            goTodayButton.addEventListener("click", newGoTodayListener);
            goTodayButton.__eventListener = newGoTodayListener; 
        }

        // ----------------------------------------------------
        // ページロード時のアニメーション制御 (JavaScriptによる順次フェードイン)
        // ----------------------------------------------------
        document.addEventListener('DOMContentLoaded', () => {
            const popupFlag = document.getElementById('eventPopupFlag');
            if (popupFlag && !localStorage.getItem('eventPopupShown')) {
                popupFlag.checked = true;
                localStorage.setItem('eventPopupShown', 'true');
            }

            // フェードインの順次実行
            const elements = document.querySelectorAll('.fade-in');
            let delay = 0;
            const delayIncrement = 100; // 0.1秒ずつ遅延

            elements.forEach((el, index) => {
                // CSSで設定したtransition-delayが優先されるように、JS側ではクラス付与のみ行う
                el.style.transitionDelay = `${delay}ms`;
                delay += delayIncrement;
            });

            // bodyに'loaded'クラスを付与してアニメーション開始
            document.body.classList.add('loaded');
        });
    </script>

    <div class="actions-menu">
        <input type="checkbox" id="menu-check" />
        <a href="memo.html" class="btn btn--large">
            <span class="material-icons">create</span>
        </a>
    </div>
</body>
</html>
