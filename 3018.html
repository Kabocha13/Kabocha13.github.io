<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store">
    <title>盟主 ラクア - GATEWAY</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>

        /* 近未来/SF風デザインの基調色 */
        :root {
            --sf-main: #00FFFF; /* Electric Cyan (メインネオン) */
            --sf-dark: #0A1929; /* Deep Space Blue (背景) */
            --sf-accent: #39FF14; /* Cyber Green (アクセント) */
            --sf-text-light: #F0F8FF; /* Off-White */
            --sf-text-secondary: #007777; /* Dim Cyan */
            --sf-shadow-main: 0 0 15px var(--sf-main), 0 0 5px var(--sf-main);
            --sf-shadow-accent: 0 0 10px var(--sf-accent);
        }

        /* -------------------------
           1. 基本設定とアニメーション
           ------------------------- */
        body {
            margin: 0;
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--sf-dark);
            color: var(--sf-text-light);
            overflow-x: hidden;
            /* グリッド風の背景アニメーション */
            background-image: linear-gradient(0deg, var(--sf-dark) 90%, var(--sf-text-secondary) 100%);
            background-size: 100% 50px;
            animation: moveGrid 60s linear infinite;
        }

        @keyframes moveGrid {
            from { background-position-y: 0; }
            to { background-position-y: 100%; }
        }

        /* 全体的なフェードインアニメーション */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out;
        }
        .loaded .fade-in {
            opacity: 1;
            transform: translateY(0);
        }

        /* -------------------------
           2. ヘッダー
           ------------------------- */
        header {
            background-color: rgba(10, 25, 41, 0.8); /* 半透明化 */
            backdrop-filter: blur(5px); /* 背景のぼかし */
            display: flex;
            align-items: center;
            padding: 15px 10px;
            box-shadow: var(--sf-shadow-main);
            border-bottom: 2px solid var(--sf-main);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header .material-icons {
            font-size: 40px;
            margin-right: 15px;
            color: var(--sf-accent);
            text-shadow: var(--sf-shadow-accent);
        }
        header h1 {
            font-family: 'Orbitron', sans-serif; /* SFタイトルフォント */
            font-size: 1.6rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--sf-main);
            text-shadow: var(--sf-shadow-main);
        }

        /* -------------------------
           3. タイトルと警告
           ------------------------- */
        h1.section-title {
            text-align: center;
            font-size: 1.8rem;
            color: var(--sf-main);
            margin: 40px 0 20px;
            border-bottom: 2px solid var(--sf-accent);
            display: inline-block;
            padding-bottom: 5px;
            width: 80%;
            max-width: 400px;
            display: block;
            margin-left: auto;
            margin-right: auto;
            font-family: 'Orbitron', sans-serif;
            text-shadow: var(--sf-shadow-main);
        }

        .talk { /* 警告バー */
            color: var(--sf-accent);
            text-align: center;
            font-weight: 700;
            padding: 10px 0;
            background-color: rgba(57, 255, 20, 0.1);
            border: 1px solid var(--sf-accent);
            margin-bottom: 15px;
            text-shadow: 0 0 5px var(--sf-accent);
            animation: blink 3s linear infinite; /* 点滅アニメーション */
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #imageUpdateNote {
            color: var(--sf-accent);
            font-size: 0.9rem;
            text-shadow: 0 0 5px var(--sf-accent);
        }

        h { /* 最後の責任免除のテキスト */
            display: block;
            text-align: center;
            font-size: 0.8rem;
            color: #696969;
            margin-top: 30px;
            padding-bottom: 20px;
            font-family: 'Rajdhani', sans-serif;
        }

        /* -------------------------
           4. ボタン
           ------------------------- */
        .cyber-button {
            display: block;
            margin: 25px auto;
            padding: 1.2rem;
            font-size: 1.6rem;
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid var(--sf-main);
            background-color: rgba(0, 255, 255, 0.1);
            color: var(--sf-main);
            transition: all 0.3s ease;
            box-shadow: var(--sf-shadow-main);
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }

        /* グリッチアニメーション */
        @keyframes glitch {
            0% { text-shadow: 2px 2px var(--sf-accent), -2px -2px var(--sf-main); }
            10% { text-shadow: -2px -2px var(--sf-accent), 2px 2px var(--sf-main); }
            20% { text-shadow: 4px 0 var(--sf-accent), -4px 0 var(--sf-main); }
            30% { text-shadow: 0 4px var(--sf-accent), 0 -4px var(--sf-main); }
            100% { text-shadow: none; }
        }
        .glitch-active {
            animation: glitch 0.2s linear 5, none 0.5s;
        }

        /* サブボタン */
        .button-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .sub-button {
            padding: 0.8rem 1.2rem;
            font-size: 1.1rem;
            background-color: rgba(57, 255, 20, 0.1);
            color: var(--sf-accent);
            border: 1px solid var(--sf-accent);
            box-shadow: var(--sf-shadow-accent);
            transition: all 0.3s ease;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
        }
        .sub-button:hover {
            background-color: rgba(57, 255, 20, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 0 20px var(--sf-accent);
        }
        .sub-button:active {
            transform: translateY(0);
        }

        /* -------------------------
           5. 画像とメニュー
           ------------------------- */
        .menu-image, .menu-header-images img {
            max-width: 95%;
            height: auto;
            border: 2px solid var(--sf-main);
            box-shadow: var(--sf-shadow-main);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .menu-image {
            text-align: center;
            margin-bottom: 30px;
        }
        .menu-image img {
            max-width: 100%;
            display: block;
            margin: auto;
            cursor: pointer;
        }
        .menu-header-images {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            padding: 0 10px;
        }
        .menu-header-images img {
            max-width: 48%;
            cursor: pointer;
        }
        .menu-image img:hover, .menu-header-images img:hover {
            transform: scale(1.01);
            box-shadow: 0 0 30px var(--sf-main), 0 0 10px var(--sf-main);
        }


        /* -------------------------
           6. ポップアップ
           ------------------------- */
        .popup-flag { display: none; }

        .popup-background {
            background: rgba(0, 0, 0, 0.9);
            transition: opacity 0.5s ease;
        }

        .popup {
            background: var(--sf-dark);
            border: 3px solid var(--sf-main);
            box-shadow: 0 0 20px var(--sf-main);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease, transform 0.5s ease;
            transform: translate(-50%, -50%) scale(0.8);
            width: 90%;
            max-width: 450px;
        }

        .popup-flag:checked + .popup-background {
            opacity: 1;
            visibility: visible;
        }

        .popup-flag:checked + .popup-background + .popup {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
            animation: popupGlitch 0.3s linear;
        }
        @keyframes popupGlitch {
            0% { transform: translate(-50%, -50%) scale(1) skew(5deg, 5deg); }
            25% { transform: translate(-50%, -50%) scale(1.05) skew(-5deg, -5deg); }
            50% { transform: translate(-50%, -50%) scale(1) skew(2deg, 2deg); }
            75% { transform: translate(-50%, -50%) scale(1.03) skew(-2deg, -2deg); }
            100% { transform: translate(-50%, -50%) scale(1) skew(0, 0); }
        }

        .close-button {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 30px;
            color: var(--sf-accent);
            cursor: pointer;
            text-shadow: var(--sf-shadow-accent);
            transition: transform 0.2s;
        }
        .close-button:hover {
            transform: rotate(90deg) scale(1.2);
        }

        .popup .content h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--sf-main);
            font-size: 2rem;
            text-shadow: var(--sf-shadow-main);
            border-bottom: 2px dashed var(--sf-accent);
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .popup .content h5 {
            color: var(--sf-text-light);
            font-size: 1.3rem;
            line-height: 1.6;
        }

        /* -------------------------
           7. FAB (フローティングボタン)
           ------------------------- */
        .actions-menu {
            position: fixed;
            width: 60px;
            height: 60px;
            right: 20px;
            bottom: 20px;
            z-index: 50;
        }
        .btn--large {
            background: var(--sf-accent);
            width: 60px;
            height: 60px;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--sf-accent);
            transition: all 0.3s ease;
            animation: pulse 2s infinite; /* 脈動アニメーション */
            border-radius: 50%; /* 円形維持 */
        }
        .btn--large:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px var(--sf-accent);
        }
        .btn--large .material-icons {
            font-size: 30px;
            color: var(--sf-dark);
            text-shadow: 0 0 5px var(--sf-text-light);
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 10px var(--sf-accent); }
            50% { box-shadow: 0 0 30px var(--sf-accent); }
            100% { box-shadow: 0 0 10px var(--sf-accent); }
        }

    </style>
</head>
<body class="loaded">
    <header>
        <span class="material-icons" style="font-size: 45px;">data_usage</span>
        <h1>RakuQR</h1>
    </header>
    <div class="talk fade-in" style="transition-delay: 0.2s;">🚨認証エラー: プロジェクター表示のQRは非対応です。🚨</div>
    
    <div class="button-row fade-in" style="transition-delay: 0.6s;">

        <button class="sub-button" onclick="location.href='https://portal.it-chiba.ac.jp/uprx/up/pk/pky001/Pky00101.xhtml/'">CITportal_LINK</button>

    <div class="menu-header-images" id="menuHeaderImages" style="display: none;"></div>

    <h1 class="section-title fade-in" style="transition-delay: 0.8s;">今週の食堂メニュー (食事供給スキル)</h1>
    <div id="menu1" class="menu-image fade-in" style="transition-delay: 1.0s;"></div>

    <h class="fade-in" style="transition-delay: 1.4s;">このサービスを利用したことによる利害について製作者は一切の責任をもちません。</h>

    <input type="checkbox" id="eventPopupFlag" class="popup-flag" />

    <div class="popup">
        <label for="eventPopupFlag" class="close-button">&times;</label>
        <div class="content">
            <h3>【盟主からのお知らせ - DATA_LOG_001】</h3>

        </div>
    </div>


    <script>
        // ----------------------------------------------------
        // 既存の機能はそのまま保持
        // ----------------------------------------------------
        function getCurrentTimestamp() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const MM = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            return `${yyyy}${MM}${dd}${hh}${mm}${ss}`;
        }

        function createReloadableImage(baseUrl) {
            const img = document.createElement("img");
            const updateSrc = () => {
                // 画像をリロードする前にグリッチエフェクトを追加
                img.classList.add('glitch-active');
                setTimeout(() => {
                    img.src = `${baseUrl}${getCurrentTimestamp()}`;
                    img.classList.remove('glitch-active');
                }, 300); // グリッチ時間
            };
            updateSrc();
            img.alt = "食堂ヘッダー画像";
            img.style.cursor = "pointer";
            img.addEventListener("click", updateSrc);
            return img;
        }

        function shouldShowMenuHeaderImages() {
            const now = new Date();
            const day = now.getDay();
            const hour = now.getHours();
            // 月曜日から金曜日 (1-5) の 11時〜13時台 (11:00-13:59)
            return day >= 1 && day <= 5 && hour >= 11 && hour < 14;
        }

        if (shouldShowMenuHeaderImages()) {
            const headerImageContainer = document.getElementById("menuHeaderImages");
            headerImageContainer.style.display = "flex";
            headerImageContainer.appendChild(createReloadableImage("https://www.cit-s.com/i_catch/dining/narashino1.jpg?"));
            headerImageContainer.appendChild(createReloadableImage("https://www.cit-s.com/i_catch/dining/narashino2.jpg?"));
            document.getElementById("imageUpdateNote").style.display = "block";
        }

// ====================================
// 🍔 食堂メニュー画像 URL 生成関数 (変更点)
// ====================================
/**
 * 指定された日付の食堂メニューURLを生成します。
 * 週番号は、月の最初の日を基準に計算されます。
 * @param {string} baseName - メニューのベース名 ("sd1" または "sd2")
 * @param {Date} targetDate - URLを生成したい週に含まれる日付 (通常は月曜日)
 * @returns {string} - 生成されたメニュー画像のURL
 */
function getMenuURL(baseName, targetDate) {
    const year = targetDate.getFullYear();
    const month = targetDate.getMonth() + 1; // 0-11 -> 1-12
    const targetMonth = `${year}${String(month).padStart(2, '0')}`;
    
    const dayOfMonth = targetDate.getDate();

    // targetDateの月の1日を取得
    const firstDayOfMonth = new Date(targetDate.getFullYear(), targetDate.getMonth(), 1);
    // 1日の曜日 (0:日曜, 1:月曜, ...)
    const firstDayOfWeek = firstDayOfMonth.getDay(); 
    
    // 週番号の計算（月の最初の日を起点として数える方式）
    // 月曜始まりとして調整 (1日が月曜であれば0、日曜であれば6)
    const firstDayDiffFromMonday = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1;
    
    // 週番号の計算: (日付 + 1日の月曜からのずれ) / 7 を切り上げ
    let weekNumber = Math.ceil((dayOfMonth + firstDayDiffFromMonday) / 7);

    return `https://www.cit-s.com/wp/wp-content/themes/cit/menu/${baseName}_${targetMonth}_${weekNumber}.png`;
}


// ====================================
// 🍔 画像のロードと遡り再試行ロジック (変更点)
// ====================================
/**
 * 食堂メニュー画像をロードし、失敗した場合は月をまたいで遡りながら再試行します。
 * 試行順: (今月の)第5週目 -> 第4週目 -> ... -> 第1週目 -> (前月の)第N週目
 * @param {string} elementId - 画像を挿入するDOM要素のID ("menu1" または "menu2")
 * @param {string} baseName - メニューのベース名 ("sd1" または "sd2")
 * @param {number} retryWeekOffset - 遡る週のオフセット (0: 第5週目から開始, 1: 第4週目, ...)
 */
function loadMenuImageWithRetry(elementId, baseName, retryWeekOffset = 0) {
    const container = document.getElementById(elementId);
    if (!container) return;

    // 以前の画像やコンテンツがあれば削除
    while (container.firstChild) {
        container.removeChild(container.firstChild);
    }
    
    // --- 試行対象日の決定ロジック ---
    const today = new Date();
    const currentMonth = today.getMonth();
    const currentYear = today.getFullYear();

    // 1. まず今月の1日を取得
    const firstDayOfMonth = new Date(currentYear, currentMonth, 1);
    
    // 2. 第5週目の月曜日を計算
    // 1日が月曜から数えて何日ずれているか (月曜(1)を0とする)
    const firstDayOfWeek = firstDayOfMonth.getDay(); 
    const firstDayDiffFromMonday = firstDayOfWeek === 0 ? 6 : firstDayOfWeek - 1;
    
    // 第5週目の月曜日 (1日 + 4週間分(28日) - 1日の月曜との差)
    const fifthMonday = new Date(firstDayOfMonth);
    fifthMonday.setDate(firstDayOfMonth.getDate() + 28 - firstDayDiffFromMonday);

    // 3. 試行対象日を計算: 第5週の月曜日から `retryWeekOffset` 週分遡る
    const targetDate = new Date(fifthMonday);
    targetDate.setDate(fifthMonday.getDate() - (retryWeekOffset * 7));
    
    // 4. URLを生成
    const img = document.createElement("img");
    img.src = getMenuURL(baseName, targetDate);
    img.alt = `食堂メニュー ${baseName} (遡り ${retryWeekOffset} 週目のURLを試行中 - ${targetDate.toLocaleDateString()})`;
    
    // --- 試行継続の条件チェック ---
    // 試行対象日が前々月以前ではないかチェック (今月 or 前月までOK)
    const targetMonth = targetDate.getMonth();
    const targetYear = targetDate.getFullYear();
    
    // 前月の月番号
    const previousMonth = (currentMonth === 0) ? 11 : currentMonth - 1;
    const previousYear = (currentMonth === 0) ? currentYear - 1 : currentYear;

    // 試行対象日が「今月」または「前月」の範囲内であるか
    let isWithinAllowedMonths = false;
    if (targetYear === currentYear && targetMonth === currentMonth) {
        isWithinAllowedMonths = true; // 今月
    } else if (targetYear === previousYear && targetMonth === previousMonth) {
        isWithinAllowedMonths = true; // 前月
    }

    // 画像ロード失敗時の処理
    img.onerror = () => {
        const nextRetryOffset = retryWeekOffset + 1;
        
        // 次の試行が許容範囲内であれば再試行
        if (isWithinAllowedMonths) {
            // 次の週を試行
            console.log(`[${baseName}] 画像ロード失敗: ${img.src}。前週を試行します (遡り ${nextRetryOffset})。`);
            loadMenuImageWithRetry(elementId, baseName, nextRetryOffset);
        } else {
            console.error(`[${baseName}] 画像ロードに最大回数失敗しました、または前々月以前に達しました。表示できません。`);
            // 画像が見つからなかった場合の代替表示
            container.innerHTML = `<p style="text-align: center; color: var(--color-dark); font-weight: 700; border: 4px dashed var(--color-dark); padding: 20px; border-radius: 10px; background-color: white; box-shadow: 8px 8px 0 var(--color-dark);">
                今週のメニューは見つかりません。<br>(${baseName}: 試行終了)</p>`;
        }
    };

    // 画像が成功した場合のonload処理
    img.onload = () => {
        console.log(`[${baseName}] 画像ロード成功: ${img.src}`);
    };

    container.appendChild(img);
}

// メニュー画像のロードを実行
loadMenuImageWithRetry("menu1", "sd1");
loadMenuImageWithRetry("menu2", "sd2");

// 既存の変数参照を維持するため、DOM要素から取得
let menu1 = document.getElementById("menu1").querySelector('img') || {src: ''};
let menu2 = document.getElementById("menu2").querySelector('img') || {src: ''};

        // ----------------------------------------------------
        // ページロード時のアニメーション制御 (JavaScriptによる順次フェードイン)
        // ----------------------------------------------------
        document.addEventListener('DOMContentLoaded', () => {
            const popupFlag = document.getElementById('eventPopupFlag');
            if (popupFlag && !localStorage.getItem('eventPopupShown')) {
                popupFlag.checked = true;
                localStorage.setItem('eventPopupShown', 'true');
            }

            // フェードインの順次実行
            const elements = document.querySelectorAll('.fade-in');
            let delay = 0;
            const delayIncrement = 100; // 0.1秒ずつ遅延

            elements.forEach((el, index) => {
                // CSSで設定したtransition-delayが優先されるように、JS側ではクラス付与のみ行う
                el.style.transitionDelay = `${delay}ms`;
                delay += delayIncrement;
            });

            // bodyに'loaded'クラスを付与してアニメーション開始
            document.body.classList.add('loaded');
        });
    </script>

    <div class="actions-menu">
        <input type="checkbox" id="menu-check" />
        <a href="memo.html" class="btn btn--large">
            <span class="material-icons">create</span>
        </a>
    </div>
</body>
