<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store">
  <title>盟主 ラクア</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <style>

    /* リムル風デザインの基調色 */
    :root {
      --rimuru-main: #1E90FF; /* Dodger Blue (スライムの青) */
      --rimuru-dark: #191970; /* Midnight Blue (濃紺) */
      --rimuru-accent: #20B2AA; /* Light Sea Green (スキル/魔法) */
      --rimuru-success: #3CB371; /* Medium Sea Green (サブボタン) */
      --rimuru-warning: #FFA07A; /* Light Salmon (警告) */
      --rimuru-error: #E74C3C; /* Red (FAB) */
      --rimuru-text-light: #F0F8FF; /* Alice Blue */
      --rimuru-text-dark: #333;
      --rimuru-shadow: rgba(0, 0, 0, 0.2);
    }

    body {
      margin: 0;
      font-family: 'Noto Sans JP', sans-serif; /* 日本語に対応したモダンなフォント */
      background-color: #F0F8FF; /* Alice Blue (背景を少し明るく) */
      color: var(--rimuru-text-dark);
    }
    header {
      background-color: var(--rimuru-dark); /* 濃紺のヘッダー */
      color: var(--rimuru-text-light);
      display: flex;
      align-items: center;
      padding: 15px 10px; /* パディングを増やす */
      box-shadow: 0 3px 6px var(--rimuru-shadow);
    }
    header img {
      height: 45px; /* 大きく */
      margin-right: 15px;
      cursor: pointer;
    }
    header h1 {
      font-size: 1.4rem; /* 大きく */
      margin: 0;
      font-weight: 700;
    }
    .menu-image {
      text-align: center;
      margin-bottom: 30px;
    }
    .menu-image img {
      max-width: 95%; /* 枠線を少し開ける */
      height: auto;
      border-radius: 12px; /* 角丸を強調 */
      box-shadow: 0 4px 8px var(--rimuru-shadow);
    }
    .menu-header-images {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
      padding: 0 10px;
    }
    .menu-header-images img {
      max-width: 48%; /* 画面端との隙間を確保 */
      height: auto;
      border-radius: 10px;
      box-shadow: 0 2px 4px var(--rimuru-shadow);
    }

    /* メインボタン: 出席する */
    #go-today {
      display: block;
      width: 90%;
      max-width: 400px;
      margin: 25px auto;
      padding: 1.2rem; /* パディングを増やして大きく */
      font-size: 1.6rem;
      background-color: var(--rimuru-main); /* スライムブルー */
      color: white;
      border: none;
      border-radius: 10px;
      text-align: center;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(30, 144, 255, 0.4); /* 青い影 */
      transition: transform 0.2s ease, background-color 0.3s, box-shadow 0.3s;
    }
    #go-today:active {
      transform: scale(0.96);
      background-color: #104E8B; /* Darker Blue */
      box-shadow: 0 3px 6px rgba(30, 144, 255, 0.6);
    }

    /* サブボタン */
    .button-row {
      display: flex;
      justify-content: center;
      gap: 15px; /* 隙間を調整 */
      margin-top: 10px;
      margin-bottom: 20px;
    }
    .sub-button {
      padding: 0.9rem 1.5rem;
      font-size: 1.1rem;
      background-color: var(--rimuru-success); /* エメラルドグリーンに近い緑 */
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(60, 179, 113, 0.4);
      transition: background-color 0.3s ease, box-shadow 0.3s;
    }
    .sub-button:active {
      background-color: #2E8B57; /* Darker Green */
      box-shadow: 0 1px 3px rgba(60, 179, 113, 0.6);
    }

    input[type="checkbox"] {
      display: none;
    }

    /* フローティングアクションボタン (FAB) */
    .actions-menu {
      position: fixed;
      width: 60px;
      height: 60px;
      right: 20px;
      bottom: 20px;
    }
    .btn {
      background: var(--rimuru-error);
      border: none;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .talk {
      color: var(--rimuru-warning); /* 警告は明るい色に */
      text-align: center;
      font-weight: 700;
      padding: 10px 0;
      background-color: #FFFACD; /* Lemon Chiffon (警告背景) */
      border-bottom: 2px solid var(--rimuru-warning);
      margin-bottom: 15px;
    }
    .btn--large {
      width: 60px;
      height: 60px;
      position: absolute;
      top: 0;
      left: 0;
    }
    .popup-flag {
      display: none;
    }

    /* ポップアップ */
    .popup-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8); /* 背景をより暗く */
      z-index: 1001;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--rimuru-text-light); /* 背景を明るく */
      padding: 30px 20px;
      border-radius: 15px; /* 角丸を強調 */
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      z-index: 1002;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
      width: 90%;
      max-width: 450px;
      box-sizing: border-box;
    }

    .popup-flag:checked + .popup-background {
      opacity: 1;
      visibility: visible;
    }

    .popup-flag:checked + .popup-background + .popup {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1); /* ポップアップ時に少しアニメーション */
    }

    .close-button {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 28px;
      cursor: pointer;
      color: var(--rimuru-dark);
    }

    .popup .content {
      text-align: center;
    }

    .popup .content h3 {
      margin-top: 0;
      color: var(--rimuru-main); /* メインカラー */
      font-size: 2rem;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
      border-bottom: 2px solid var(--rimuru-accent);
      padding-bottom: 5px;
      margin-bottom: 15px;
    }

    .popup .content h5 {
      color: var(--rimuru-dark);
      font-size: 1.3rem;
      line-height: 1.6;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      color: var(--rimuru-dark);
      margin: 20px 0 15px;
      border-bottom: 3px solid var(--rimuru-accent);
      display: inline-block;
      padding-bottom: 5px;
      width: 80%;
      max-width: 350px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    #imageUpdateNote {
      text-align: center;
      display: block;
      color: var(--rimuru-accent);
      font-size: 0.9rem;
      margin-top: -20px;
      margin-bottom: 10px;
    }

    h { /* 最後の責任免除のテキスト */
      display: block;
      text-align: center;
      font-size: 0.8rem;
      color: #696969; /* Dim Gray */
      margin-top: 30px;
      padding-bottom: 20px;
    }

  </style>
</head>
<body>
  <header>
    <span class="material-icons" style="font-size: 45px; margin-right: 15px; color: var(--rimuru-accent);">bubble_chart</span>
    <h1>盟主 ラクアの「智慧之王」</h1>
  </header>
  <div class="talk">🚨プロジェクター表示のQRは非対応です。🚨</div>
  
  <button id="go-today">出席する (自動誘導)</button>

  <div class="button-row">
    <button class="sub-button" onclick="location.href='https://cit.manaba.jp/ct/home/'">manaba</button>
    <button class="sub-button" onclick="location.href='https://portal.it-chiba.ac.jp/uprx/up/pk/pky001/Pky00101.xhtml/'">CITportal</button>
  </div>

  <div class="menu-header-images" id="menuHeaderImages" style="display: none;"></div>
  <h id="imageUpdateNote" style="display: none;">画像タップで「大賢者」が最新画像に更新します</h>

  <h1>今週の食堂メニュー (食事供給スキル)</h1>
  <div id="menu1" class="menu-image"></div>
  <div id="menu2" class="menu-image"></div>
  <h>このサービスを利用したことによる利害について製作者は一切の責任をもちません。</h>

  <input type="checkbox" id="eventPopupFlag" class="popup-flag" />
  <label for="eventPopupFlag" class="popup-background"></label>
  <div class="popup">
    <label for="eventPopupFlag" class="close-button">&times;</label>
    <div class="content">
      <h3>【盟主からのお知らせ】</h3>
      <h5>リムル様より...</h5>
    </div>
  </div>


  <script>
    function getCurrentTimestamp() {
      const now = new Date();
      const yyyy = now.getFullYear();
      const MM = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      const ss = String(now.getSeconds()).padStart(2, '0');
      return `${yyyy}${MM}${dd}${hh}${mm}${ss}`;
    }

    function createReloadableImage(baseUrl) {
      const img = document.createElement("img");
      const updateSrc = () => {
        img.src = `${baseUrl}${getCurrentTimestamp()}`;
      };
      updateSrc();
      img.alt = "食堂ヘッダー画像";
      img.style.cursor = "pointer";
      img.addEventListener("click", updateSrc);
      return img;
    }

    function shouldShowMenuHeaderImages() {
      const now = new Date();
      const day = now.getDay(); // 日曜:0
      const hour = now.getHours();
      return day !== 0 && hour >= 11 && hour < 14;
    }

    if (shouldShowMenuHeaderImages()) {
      const headerImageContainer = document.getElementById("menuHeaderImages");
      headerImageContainer.style.display = "flex";
      headerImageContainer.appendChild(createReloadableImage("https://www.cit-s.com/i_catch/dining/narashino1.jpg?"));
      headerImageContainer.appendChild(createReloadableImage("https://www.cit-s.com/i_catch/dining/narashino2.jpg?"));
      document.getElementById("imageUpdateNote").style.display = "block";
    }

    function getMenuURL(baseName) {
        const today = new Date();
        // 1. その週の月曜日を特定
        const dayOfWeek = today.getDay(); // 0=日, 1=月, ..., 6=土
        // 月曜日を起点とするため、日曜日の場合は-6日（前週の月曜日）、火曜日の場合は-1日、など
        const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
        
        const monday = new Date(today);
        monday.setDate(today.getDate() + diff);
        
        // 2. 対象月 (YYYYMM) の特定 (月曜日の月を採用)
        const year = monday.getFullYear();
        const month = monday.getMonth() + 1; // 0-11 から 1-12 に
        const targetMonth = `${year}${String(month).padStart(2, '0')}`;
        
        // 3. 週番号 (WeekNumber) の計算と調整
        // 週番号は、(月曜日の日付 / 7) を切り上げて求めます。
        // 例: 9/29 -> Math.ceil(29 / 7) = 5
        const weekNumber = Math.ceil(monday.getDate() / 7);
        
        // 4. URLの生成 (週番号はゼロ埋めなし)
        return `https://www.cit-s.com/wp/wp-content/themes/cit/menu/${baseName}_${targetMonth}_${weekNumber}.png`;
    }

    const menu1 = document.createElement("img");
    menu1.src = getMenuURL("sd1");
    menu1.alt = "食堂メニュー1";
    document.getElementById("menu1").appendChild(menu1);

    const menu2 = document.createElement("img");
    menu2.src = getMenuURL("sd2");
    menu2.alt = "食堂メニュー2";
    document.getElementById("menu2").appendChild(menu2);

    // VIPの授業予定データ
    const vipClasses = {
        0: [], // Sunday
        1: [ // Monday
            { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/1251" }
        ],
        2: [ // Tuesday
            { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/5301" },
            { start: 13, end: 14, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/1333" }
        ],
        3: [ // Wednesday
            { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7105" },
            { start: 12, end: 13, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7103" },
            { start: 14, end: 15, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7104" }
        ],
        4: [ // Thursday
            { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7104" },
            { start: 11, end: 12, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/1102" }
        ],
        5: [ // Friday
            { start: 13, end: 14, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7205" }
        ],
        6: []  // Saturday
    };

    // 既存のgo-todayイベントリスナーを削除 (もしあれば)
    const goTodayButton = document.getElementById("go-today");
    if (goTodayButton) {
      const oldEventListener = goTodayButton.__eventListener; // 以前設定したリスナーを識別するプロパティがあれば
      if (oldEventListener) {
        goTodayButton.removeEventListener("click", oldEventListener);
      } else {
        // 既存のリスナーが特定できない場合、イベントハンドラーを直接上書きする代替手段
        goTodayButton.onclick = null;
      }
    }

    // 新しいgo-todayイベントリスナーを設定
    const newGoTodayListener = () => {
        const now = new Date();
        const day = now.getDay(); // 0: Sunday, 1: Monday, ..., 6: Saturday
        const time = now.getHours() + now.getMinutes() / 60; // 現在時刻を少数で表現 (例: 9.5 は 9時30分)

        const todayVipClasses = vipClasses[day];
        let foundClass = null;

        for (const c of todayVipClasses) {
            // 授業開始前後30分までを判定範囲とする
            if (time >= (c.start - 0.5) && time <= (c.end + 0.5)) {
                foundClass = c;
                break;
            }
        }

        if (foundClass) {
            window.open(foundClass.url, '_blank'); // 新しいタブで開く
        } else {
            // 該当する授業がない場合は、従来の曜日ページに遷移
            const days = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
            const target = days[day];
            location.href = `${target}.html`;
        }
    };
    if (goTodayButton) {
      goTodayButton.addEventListener("click", newGoTodayListener);
      goTodayButton.__eventListener = newGoTodayListener; // 後で削除するためにリスナーを保存
    }


    document.addEventListener('DOMContentLoaded', () => {
        const popupFlag = document.getElementById('eventPopupFlag');
        if (popupFlag && !localStorage.getItem('eventPopupShown')) {
            popupFlag.checked = true;
            localStorage.setItem('eventPopupShown', 'true');
        }
    });
  </script>

  <div class="actions-menu">
    <input type="checkbox" id="menu-check" />
    <a href="memo.html" class="btn btn--large">
      <span class="material-icons" style="font-size: 30px; color: white;">create</span>
    </a>
  </div>
</body>
</html>
