<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store">
    <title>RakuQR | ラクアトゥーン</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* ==================================== */
        /* 🎨 カラー変数 (トゥーンタウン・パレット) */
        /* ==================================== */
        :root {
            --color-main: #E74C3C; /* ミッキーレッド */
            --color-main-dark: #C0392B;
            --color-accent: #F1C40F; /* バナナイエロー */
            --color-dark: #333333;
            --color-background: #ECF0F1;
            --color-sub-button: #5DADE2; /* スカイブルー */
        }

        /* ==================================== */
        /* 🐭 ベーススタイル */
        /* ==================================== */
        body {
            margin: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: var(--color-background);
            color: var(--color-dark);
            padding-bottom: 30px; 
            min-height: 100vh;
        }

        /* ==================================== */
        /* 🎈 ヘッダーとロゴ */
        /* ==================================== */
        header {
            background-color: var(--color-main);
            color: white;
            display: flex;
            align-items: center;
            padding: 15px 20px;
            box-shadow: 0 4px 0 var(--color-dark);
            border-bottom: 3px solid var(--color-dark);
            cursor: pointer;
        }
        .mickey-logo {
            width: 35px; height: 35px; background: var(--color-dark); border-radius: 50%; position: relative; margin-right: 15px; box-shadow: 0 2px 0 rgba(255, 255, 255, 0.4) inset;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .mickey-logo::before, .mickey-logo::after {
            content: ''; position: absolute; width: 25px; height: 25px; background: var(--color-dark); border-radius: 50%; top: -15px; border: 2px solid white;
            transition: all 0.3s ease;
        }
        .mickey-logo::before { left: -10px; }
        .mickey-logo::after { right: -10px; }
        header h1 {
            font-size: 1.6rem; margin: 0; font-weight: 900;
            text-shadow: 2px 2px 0 var(--color-dark), 4px 4px 0 var(--color-accent); letter-spacing: 1px;
        }

        /* 📣 警告メッセージ */
        .talk {
            background-color: var(--color-accent); color: var(--color-dark); padding: 10px; text-align: center; font-weight: 700; font-size: 1rem; border-bottom: 3px solid var(--color-dark); border-top: 3px solid var(--color-dark); box-shadow: 0 2px 0 var(--color-dark);
            animation: shake 0.8s cubic-bezier(.36,.07,.19,.97) both;
            transform: translate3d(0, 0, 0);
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }


        /* 👨‍💻 出席ボタン */
        #go-today {
            display: block; width: 100%; margin: 25px 0; padding: 1.5rem; font-size: 1.4rem;
            background-color: var(--color-main); color: white;
            border: 4px solid var(--color-dark);
            border-radius: 15px;
            box-shadow: 5px 5px 0 var(--color-dark);
            transition: all 0.1s ease;
            cursor: pointer;
        }
        #go-today:active {
            transform: translate(5px, 5px) rotate(-3deg) scale(0.95);
            box-shadow: 0 0 0 var(--color-dark);
            background-color: var(--color-main-dark);
        }
        
        /* サブボタン群 */
        .button-row { display: flex; justify-content: center; gap: 15px; margin-top: 15px; margin-bottom: 30px; }
        .sub-button {
            padding: 0.8rem 1.5rem; font-size: 1.1rem;
            background-color: var(--color-sub-button); color: white;
            border: 3px solid var(--color-dark); border-radius: 10px; font-weight: 700;
            box-shadow: 3px 3px 0 var(--color-dark);
            transition: all 0.05s ease-out;
            cursor: pointer;
        }
        .sub-button:hover { transform: scale(1.03); }
        .sub-button:active {
            transform: translate(3px, 3px) scale(0.98);
            box-shadow: 0 0 0 var(--color-dark);
        }

        /* メニュータイトル、画像、フッター */
        .menu-header-images { display: flex; justify-content: center; gap: 15px; margin-top: 30px; margin-bottom: 10px; padding: 0 10px; }
        .menu-header-images img { max-width: 50%; height: auto; border-radius: 10px; border: 3px solid var(--color-dark); box-shadow: 5px 5px 0 var(--color-dark); object-fit: cover; }
        #imageUpdateNote { display: block; text-align: center; font-size: 0.9rem; color: var(--color-dark); font-weight: 700; margin-bottom: 20px; }
        .title-wrapper { text-align: center; margin-top: 40px; margin-bottom: 25px; }
        h1.section-title { font-size: 1.8rem; font-weight: 900; color: var(--color-dark); padding: 8px 20px; border: 4px solid var(--color-dark); background-color: var(--color-accent); box-shadow: 4px 4px 0 var(--color-dark); display: inline-block; transform: rotate(-1deg); }
        .menu-image { text-align: center; margin-bottom: 25px; padding: 0 10px; }
        .menu-image img { max-width: 100%; height: auto; border-radius: 10px; border: 4px solid var(--color-dark); box-shadow: 8px 8px 0 var(--color-dark); transition: transform 0.3s ease; }
        .menu-image img:hover { transform: translate(-2px, -2px) scale(1.01); }
        .menu-image p { margin: 0; } /* 追加: 画像がない場合のテキスト表示用 */
        .disclaimer { text-align: center; font-size: 0.8rem; color: #777; margin-top: 30px; padding: 0 20px; cursor: pointer; }

        /* 🐿️ チップとデールの隠し場所 */
        #chip-dale-popup {
            position: fixed; top: 100px; left: 50%; transform: translateX(-50%);
            background: var(--color-accent); color: var(--color-dark);
            border: 3px solid var(--color-dark); border-radius: 8px;
            padding: 10px 20px; font-weight: 700; z-index: 1000;
            box-shadow: 4px 4px 0 var(--color-dark);
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
            white-space: nowrap;
        }

        /* モバイル最適化 */
        @media (max-width: 600px) {
            header h1 { font-size: 1.4rem; }
            #go-today { font-size: 1.3rem; padding: 1.2rem; }
            .sub-button { font-size: 1rem; padding: 0.7rem 1.2rem; }
            h1.section-title { font-size: 1.4rem; border-width: 3px; }
        }
    </style>
</head>
<body>

    <header id="mainHeader">
        <div class="mickey-logo" id="mickeyLogo"></div>
        <h1>RakuQR (ラクア)</h1>
    </header>

    <div class="talk" id="warning-talk">🚨プロジェクター表示のQRは非対応です。🚨</div>

    <div class="container">
        <button id="go-today">👨‍💻 今日の授業に出席する</button>

        <div class="button-row">
            <button class="sub-button" onclick="location.href='https://cit.manaba.jp/ct/home/'">manaba</button>
            <button class="sub-button" onclick="location.href='https://portal.it-chiba.ac.jp/uprx/up/pk/pky001/Pky00101.xhtml/'">CITportal</button>
        </div>

        <div class="menu-header-images" id="menuHeaderImages" style="display: none;"></div>
        <p id="imageUpdateNote" style="display: none;">画像タップで最新画像に更新</p>

        <div class="title-wrapper">
            <h1 class="section-title">今週の食堂メニュー</h1>
        </div>

        <div id="menu1" class="menu-image"></div>
        <div id="menu2" class="menu-image"></div>

        <p class="disclaimer" id="disclaimer">このサービスを利用したことによる利害について製作者は一切の責任をもちません。</p>
    </div>

    <div id="chip-dale-popup">どんぐりゲット！🐿️（シークレット）</div>
    
    <script>
        // 既存関数 (機能維持のため省略せずに記述)
        function getCurrentTimestamp() {
            const now = new Date();
            const yyyy = now.getFullYear();
            const MM = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            return `${yyyy}${MM}${dd}${hh}${mm}${ss}`;
        }

        function createReloadableImage(baseUrl) {
            const img = document.createElement("img");
            const updateSrc = () => {
                img.src = `${baseUrl}${getCurrentTimestamp()}`;
            };
            updateSrc();
            img.alt = "食堂ヘッダー画像";
            img.style.cursor = "pointer";
            img.addEventListener("click", updateSrc);
            return img;
        }

        function shouldShowMenuHeaderImages() {
            const now = new Date();
            const day = now.getDay();
            const hour = now.getHours();
            return day !== 0 && hour >= 11 && hour < 14;
        }

        if (shouldShowMenuHeaderImages()) {
            const headerImageContainer = document.getElementById("menuHeaderImages");
            headerImageContainer.style.display = "flex";
            headerImageContainer.appendChild(createReloadableImage("https://www.cit-s.com/i_catch/dining/narashino1.jpg?"));
            headerImageContainer.appendChild(createReloadableImage("https://www.cit-s.com/i_catch/dining/narashino2.jpg?"));
            document.getElementById("imageUpdateNote").style.display = "block";
        }

        // ====================================
        // 🍔 メニュー画像再試行ロジック (ここから修正/追加)
        // ====================================

        // 既存のgetMenuURL関数を拡張し、週のオフセットを考慮できるようにします
        function getMenuURL(baseName, weekOffset = 0) {
            const today = new Date();
            const dayOfWeek = today.getDay();
            // 月曜日に設定
            const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            
            const monday = new Date(today);
            // weekOffsetを考慮: 1週間 = 7日
            monday.setDate(today.getDate() + diff + weekOffset * 7); 
            
            const year = monday.getFullYear();
            const month = monday.getMonth() + 1;
            const targetMonth = `${year}${String(month).padStart(2, '0')}`;
            
            // 週番号を計算
            // 修正後のgetMenuURLでは、weekOffsetによって日付が移動しているため、
            // その日付の属する週番号（月初から数えて何週目か）が取得されます。
            const weekNumber = Math.ceil(monday.getDate() / 7);
            
            return `https://www.cit-s.com/wp/wp-content/themes/cit/menu/${baseName}_${targetMonth}_${weekNumber}.png`;
        }

        // 画像のロードを試行し、失敗した場合は週番号をインクリメントして再試行する関数
        function loadMenuImageWithRetry(elementId, baseName, retryCount = 0) {
            const maxRetries = 3; // 最大再試行回数 (今週 + 3週先まで)
            const container = document.getElementById(elementId);
            
            if (!container) return;

            // 以前の画像やコンテンツがあれば削除
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }

            const img = document.createElement("img");
            img.src = getMenuURL(baseName, retryCount); // retryCountが週のオフセットになる
            img.alt = `食堂メニュー ${baseName} (${retryCount}週目のURLを試行中)`;
            
            // 画像ロード失敗時の処理
            img.onerror = () => {
                if (retryCount < maxRetries) {
                    console.log(`[${baseName}] 画像ロード失敗: ${img.src}。次週を試行します (Retry ${retryCount + 1}/${maxRetries})。`);
                    // 次の週を試行
                    loadMenuImageWithRetry(elementId, baseName, retryCount + 1);
                } else {
                    console.error(`[${baseName}] 画像ロードに最大回数失敗しました。表示できません。`);
                    // 画像が見つからなかった場合の代替表示
                    container.innerHTML = `<p style="text-align: center; color: var(--color-dark); font-weight: 700; border: 4px dashed var(--color-dark); padding: 20px; border-radius: 10px; background-color: white; box-shadow: 8px 8px 0 var(--color-dark);">
                        今週のメニューは見つかりません。<br>(${baseName}: ${img.src}まで試行)</p>`;
                }
            };

            // 画像が成功した場合のonload処理 (特になし。DOMに追加)
            img.onload = () => {
                console.log(`[${baseName}] 画像ロード成功: ${img.src}`);
            };

            container.appendChild(img);
        }

        // メニュー画像のロードを実行
        let menu1 = {}; // グローバルスコープで再定義が必要だが、ここではローカル変数を置き換え
        let menu2 = {}; 
        loadMenuImageWithRetry("menu1", "sd1");
        loadMenuImageWithRetry("menu2", "sd2");

        // 既存の変数参照を維持するため、DOM要素から取得
        menu1 = document.getElementById("menu1").querySelector('img') || {src: ''};
        menu2 = document.getElementById("menu2").querySelector('img') || {src: ''};

        // ====================================
        // 💻 授業出席ロジック
        // ====================================

        const vipClasses = {
            0: [], 1: [],
            2: [ { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/5207" }, { start: 13, end: 14, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/1333" } ],
            3: [ { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7104" }, { start: 12, end: 13, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7103" }, { start: 14, end: 15, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7104" } ],
            4: [ { start: 9, end: 10, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7104" }, { start: 11, end: 12, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/1102" } ],
            5: [ { start: 13, end: 14, url: "https://attendance.is.it-chiba.ac.jp/attendance/class_room/7205" } ],
            6: []
        };

        const goTodayButton = document.getElementById("go-today");
        if (goTodayButton) {
            const oldEventListener = goTodayButton.__eventListener;
            if (oldEventListener) { goTodayButton.removeEventListener("click", oldEventListener); } else { goTodayButton.onclick = null; }
        }

        const newGoTodayListener = () => {
            const now = new Date();
            const day = now.getDay();
            const time = now.getHours() + now.getMinutes() / 60;
            const todayVipClasses = vipClasses[day];
            let foundClass = null;

            for (const c of todayVipClasses) {
                // 授業時間の前後30分以内 (c.start - 0.5)から(c.end + 0.5)
                if (time >= (c.start - 0.5) && time <= (c.end + 0.5)) {
                    foundClass = c;
                    break;
                }
            }

            if (foundClass) {
                window.open(foundClass.url, '_blank');
            } else {
                const target = "index";
                // 存在しないHTMLファイルへのリダイレクトはそのまま維持
                location.href = `${target}.html`; 
            }
        };
        if (goTodayButton) {
            goTodayButton.addEventListener("click", newGoTodayListener);
            goTodayButton.__eventListener = newGoTodayListener;
        }


        document.addEventListener('DOMContentLoaded', () => {
            const warningTalk = document.getElementById('warning-talk');
            if (warningTalk) {
                warningTalk.style.animation = 'none';
                void warningTalk.offsetWidth;
                warningTalk.style.animation = 'shake 0.8s cubic-bezier(.36,.07,.19,.97) both';
            }
            
            // 💡 隠れ機能のセットアップ
            setupDonaldsMenu_New(); 
            setupChipAndDale(); 
        });

        /* ==================================== */
        /* 1. ドナルドのわがままメニュー (フッター3回タップ) */
        /* ==================================== */
        function setupDonaldsMenu_New() {
            const disclaimer = document.getElementById('disclaimer');
            const talkDiv = document.getElementById('warning-talk');
            let clickCount = 0;
            let timer = null;
            
            // ロード成功したオリジナルのURL、または初期のURLを取得
            const getOriginalSrc = (baseName) => {
                // ロード成功時のURLを再取得するロジックは複雑になるため、
                // ここでは初期URLを再計算して元の週に戻す方針を維持します。
                return getMenuURL(baseName, 0); 
            };
            const originalMenu1Src = getOriginalSrc("sd1");
            const originalMenu2Src = getOriginalSrc("sd2");
            
            const specialMenuUrls = [
                "https://play-lh.googleusercontent.com/xQxbb9LtkUTHaJaVYnwVk6qO9Jz8igwjrju19lX6ImpyGhEVejhjaTXYeOThnQFlMJRgBA",
                "https://e1.pxfuel.com/desktop-wallpaper/811/1010/desktop-wallpaper-4-mickey-mouse-clubhouse-cartoon-mouse.jpg",
                "https://i.pinimg.com/564x/73/42/2c/73422c49f68c7cf2b9c613c870b7a782.jpg",
                "https://c02.castel.jp/400x/0/mickey-j110098.jpg?mod=20230212162141"
            ];

            const triggerFun = () => {
                clickCount++;

                if (timer) clearTimeout(timer);
                
                timer = setTimeout(() => {
                    clickCount = 0;
                }, 1000);

                if (clickCount >= 3) {
                    clearTimeout(timer);
                    clickCount = 0;
                    
                    talkDiv.innerHTML = "⚡️わーわー！シャッフルしちゃったよ！( > < )⚡️";
                    talkDiv.style.backgroundColor = "var(--color-main)";
                    talkDiv.style.color = "white";
                    
                    // menu1とmenu2のDOM要素を再取得
                    const currentMenu1 = document.getElementById("menu1").querySelector('img');
                    const currentMenu2 = document.getElementById("menu2").querySelector('img');

                    if (currentMenu1) currentMenu1.src = specialMenuUrls[Math.floor(Math.random() * specialMenuUrls.length)];
                    if (currentMenu2) currentMenu2.src = specialMenuUrls[Math.floor(Math.random() * specialMenuUrls.length)];
                    
                    setTimeout(() => {
                        talkDiv.innerHTML = "🚨プロジェクター表示のQRは非対応です。🚨";
                        talkDiv.style.backgroundColor = "var(--color-accent)";
                        talkDiv.style.color = "var(--color-dark)";
                        
                        // 元のURLに戻す（再試行ロジックが働かないよう、直接.srcに設定）
                        if (currentMenu1) currentMenu1.src = originalMenu1Src;
                        if (currentMenu2) currentMenu2.src = originalMenu2Src;
                    }, 3000);
                }
            };

            disclaimer.addEventListener('click', triggerFun);
        }

        /* ==================================== */
        /* 2. チップとデールの隠し場所 (ロゴ長押し - 1秒) */
        /* ==================================== */
        function setupChipAndDale() {
            const logo = document.getElementById('mickeyLogo');
            const popup = document.getElementById('chip-dale-popup');
            let pressTimer;

            const showPopup = () => {
                popup.style.opacity = 1;
                popup.style.visibility = 'visible';
                logo.style.transform = 'translateY(-5px) rotate(3deg) scale(1.1)';

                setTimeout(() => {
                    popup.style.opacity = 0;
                    popup.style.visibility = 'hidden';
                    logo.style.transform = 'none';
                }, 3000);
            };

            const startPress = () => {
                if (pressTimer) return;
                pressTimer = setTimeout(showPopup, 1000); // 1秒長押し
            };

            const cancelPress = () => {
                clearTimeout(pressTimer);
                pressTimer = null;
            };

            logo.addEventListener('touchstart', startPress);
            logo.addEventListener('touchend', cancelPress);
            logo.addEventListener('touchcancel', cancelPress);

            logo.addEventListener('mousedown', startPress);
            logo.addEventListener('mouseup', cancelPress);
            logo.addEventListener('mouseleave', cancelPress);
        }
    </script>
</body>
</html>
