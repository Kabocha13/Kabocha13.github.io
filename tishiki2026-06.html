<title>知識工学 試験対策 問題集Webアプリ</title>
<style>
:root {

* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',Meiryo,sans-serif; background:var(--bg); color:var(--text); }
header { background:linear-gradient(135deg,#134e4a,#0f766e); color:white; padding:24px 18px; }
.header-inner { max-width:1180px; margin:0 auto; }
h1 { margin:0 0 8px; font-size:clamp(24px,4vw,40px); letter-spacing:.02em; }
.subtitle { margin:0; opacity:.92; line-height:1.7; }
main { max-width:1180px; margin:0 auto; padding:18px; display:grid; grid-template-columns:310px 1fr; gap:18px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:18px; box-shadow:0 10px 24px rgba(15,23,42,.06); }
.sidebar { padding:16px; height:max-content; position:sticky; top:14px; }
.content { padding:20px; min-height:70vh; }
label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
select, input[type=number] { width:100%; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:15px; background:white; color:var(--text); }
button { border:0; border-radius:12px; padding:10px 14px; font-weight:700; cursor:pointer; transition:.15s; }
button:disabled { opacity:.55; cursor:default; }
.btn-primary { background:var(--accent); color:white; }
.btn-primary:hover:not(:disabled) { background:var(--accent2); }
.btn-secondary { background:#ccfbf1; color:#115e59; }
.btn-secondary:hover:not(:disabled) { background:#99f6e4; }
.btn-ghost { background:#f3f4f6; color:#374151; }
.btn-ghost:hover:not(:disabled) { background:#e5e7eb; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.row button { flex:1; }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
.stat { background:#f9fafb; border:1px solid var(--line); border-radius:14px; padding:12px; }
.stat b { display:block; font-size:22px; margin-bottom:2px; }
.stat span { color:var(--muted); font-size:12px; }
.progress { height:10px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin:12px 0; }
.progress > div { height:100%; background:linear-gradient(90deg,#5eead4,#0f766e); width:0%; transition:.3s; }
.pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:#115e59; background:#ccfbf1; padding:5px 9px; border-radius:999px; margin-right:6px; margin-bottom:6px; }
.q-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:12px; }
.q-num { color:var(--muted); font-weight:700; }
.question { font-size:22px; line-height:1.55; font-weight:800; margin:10px 0 18px; }
.choices { display:grid; gap:10px; }
.choice { width:100%; text-align:left; background:#fff; border:2px solid var(--line); padding:14px 16px; border-radius:16px; color:var(--text); font-weight:650; line-height:1.6; }
.choice:hover:not(:disabled) { border-color:#5eead4; background:#f0fdfa; }
.choice.selected { border-color:var(--accent); background:var(--soft); }
.choice.correct { border-color:var(--good); background:var(--goodsoft); color:#065f46; }
.choice.wrong { border-color:var(--bad); background:var(--badsoft); color:#991b1b; }
.feedback { margin-top:16px; border-radius:16px; padding:16px; line-height:1.8; display:none; }
.feedback.good { display:block; background:var(--goodsoft); border:1px solid #86efac; }
.feedback.bad { display:block; background:var(--badsoft); border:1px solid #fca5a5; }
.feedback h3 { margin:0 0 8px; font-size:18px; }
.nav { display:flex; justify-content:space-between; gap:10px; margin-top:16px; }
.nav button { flex:1; }
.small { color:var(--muted); font-size:13px; line-height:1.7; }
.list { max-height:300px; overflow:auto; border:1px solid var(--line); border-radius:14px; margin-top:12px; }
.list button { display:block; width:100%; text-align:left; background:white; border-bottom:1px solid var(--line); border-radius:0; color:var(--text); padding:10px 12px; font-weight:600; }
.list button:hover { background:#f9fafb; }
.list button:last-child { border-bottom:0; }
.notice { background:#fffbeb; border:1px solid #fcd34d; border-radius:14px; padding:12px; line-height:1.7; font-size:14px; }
.review-table { width:100%; border-collapse:collapse; margin-top:12px; font-size:14px; }
.review-table th,.review-table td { border-bottom:1px solid var(--line); padding:10px; text-align:left; vertical-align:top; }
.review-table th { background:#f9fafb; }
.hidden { display:none !important; }
@media (max-width:860px) {
  main { grid-template-columns:1fr; }
  .sidebar { position:static; }
  .q-head { flex-direction:column; }
  .question { font-size:20px; }
}
</style>

  </aside>

  <section class="card content">

    <div id="resultView" class="hidden"></div>
  </section>
</main>

const $ = (id) => document.getElementById(id);
const topicSelect = $("topicSelect");
const orderSelect = $("orderSelect");
const limitInput = $("limitInput");
const quizView = $("quizView");
const resultView = $("resultView");
let session = [];
let current = 0;
let answered = false;
let score = 0;
let answers = [];
const storeKey = "knowledgeEngineeringQuizWrongIds_v1";

function getWrongSet() {
  try { return new Set(JSON.parse(localStorage.getItem(storeKey) || "[]")); }
  catch(e) { return new Set(); }
}
function saveWrongSet(set) { localStorage.setItem(storeKey, JSON.stringify([...set])); }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function initTopics() {
  const topics = ["全範囲", ...new Set(QUESTIONS.map(q => q.topic))];
  topicSelect.innerHTML = topics.map(t => `<option value="${t}">${t}</option>`).join("");
  $("totalCount").textContent = QUESTIONS.length;
  updateStats();
}
function startQuiz() {
  const topic = topicSelect.value;
  let pool = topic === "全範囲" ? [...QUESTIONS] : QUESTIONS.filter(q => q.topic === topic);
  const wrongSet = getWrongSet();
  if (orderSelect.value === "wrong") pool = pool.filter(q => wrongSet.has(q.id));
  if (orderSelect.value === "shuffle" || orderSelect.value === "wrong") pool = shuffle(pool);
  const limit = Math.max(1, Math.min(parseInt(limitInput.value || "20", 10), pool.length));
  session = pool.slice(0, limit).map(q => ({
    ...q,
    shuffledChoices: q.choices ? shuffle(q.choices.map((choice, originalIndex) => ({ choice, originalIndex }))) : []
  }));
  current = 0; answered = false; score = 0; answers = [];
  resultView.classList.add("hidden");
  quizView.classList.remove("hidden");
  if (!session.length) {
    quizView.innerHTML = `<h2>出題できる問題がありません</h2><p class="small">「苦手だけ」に問題がない場合は、通常順かランダムで開始してください。</p>`;
    updateStats();
    return;
  }
  renderQuestion();
}
function renderQuestion() {
  const q = session[current];
  answered = false;
  let answerArea = "";
  if (q.type === "text") {
    answerArea = `
      <div class="choices">
        <input id="textAnswer" type="text" class="choice" autocomplete="off" placeholder="${escapeHtml(q.placeholder || "解答を入力")}">
        <button class="btn-primary" id="submitTextBtn">回答する</button>
      </div>`;
  } else if (q.type === "multi") {
    const choices = q.shuffledChoices.map((c, i) => `<button class="choice" data-index="${i}" type="button">${escapeHtml(c.choice)}</button>`).join("");
    answerArea = `<div class="choices">${choices}</div><div class="row" style="margin-top:12px"><button class="btn-primary" id="submitMultiBtn">回答する</button></div>`;
  } else {
    const choices = q.shuffledChoices.map((c, i) => `<button class="choice" data-index="${i}" type="button">${escapeHtml(c.choice)}</button>`).join("");
    answerArea = `<div class="choices">${choices}</div>`;
  }
  quizView.innerHTML = `
    <div class="q-head">
      <div>
        <span class="pill">${escapeHtml(q.topic)}</span>
        <span class="pill">${escapeHtml(q.source || "授業資料")}</span>
      </div>
      <div class="q-num">${current + 1} / ${session.length}</div>
    </div>
    <div class="question">${escapeHtml(q.question)}</div>
    ${answerArea}
    <div id="feedback" class="feedback"></div>
    <div class="nav">
      <button class="btn-ghost" id="prevBtn" ${current === 0 ? "disabled" : ""}>前へ</button>
      <button class="btn-secondary" id="showListBtn">問題一覧</button>
      <button class="btn-primary" id="nextBtn" disabled>次へ</button>
    </div>
    <div id="listBox" class="list hidden"></div>
  `;
  if (q.type === "text") {
    $("submitTextBtn").addEventListener("click", chooseText);
    $("textAnswer").addEventListener("keydown", e => { if (e.key === "Enter") chooseText(); });
  } else if (q.type === "multi") {
    document.querySelectorAll(".choice").forEach(btn => btn.addEventListener("click", () => btn.classList.toggle("selected")));
    $("submitMultiBtn").addEventListener("click", chooseMulti);
  } else {
    document.querySelectorAll(".choice").forEach(btn => btn.addEventListener("click", () => choose(parseInt(btn.dataset.index, 10))));
  }
  $("prevBtn").addEventListener("click", () => { if (current > 0) { current--; renderQuestion(); } });
  $("nextBtn").addEventListener("click", () => { current < session.length - 1 ? (current++, renderQuestion()) : finishQuiz(); });
  $("showListBtn").addEventListener("click", toggleList);
  updateStats();
}
function choose(index) {
  if (answered) return;
  answered = true;
  const q = session[current];
  const selectedChoice = q.shuffledChoices[index];
  const correct = selectedChoice.originalIndex === q.answer;
  if (correct) score++;
  answers[current] = { id:q.id, selected:index, selectedOriginalIndex:selectedChoice.originalIndex, correct };
  const wrongSet = getWrongSet();
  if (correct) wrongSet.delete(q.id); else wrongSet.add(q.id);
  saveWrongSet(wrongSet);
  document.querySelectorAll(".choice").forEach((btn, i) => {
    const originalIndex = q.shuffledChoices[i].originalIndex;
    btn.disabled = true;
    if (originalIndex === q.answer) btn.classList.add("correct");
    if (i === index && !correct) btn.classList.add("wrong");
    if (i === index) btn.classList.add("selected");
  });
  const fb = $("feedback");
  fb.className = "feedback " + (correct ? "good" : "bad");
  fb.innerHTML = `<h3>${correct ? "正解" : "不正解"}</h3>
    <p><b>正答：</b>${escapeHtml(q.choices[q.answer])}</p>
    <p><b>解説：</b>${escapeHtml(q.explanation)}</p>`;
  $("nextBtn").disabled = false;
  updateStats();
}
function chooseMulti() {
  if (answered) return;
  const selected = [...document.querySelectorAll(".choice.selected")].map(btn => parseInt(btn.dataset.index, 10));
  if (!selected.length) return;
  answered = true;
  const q = session[current];
  const selectedOriginals = selected.map(i => q.shuffledChoices[i].originalIndex).sort((a, b) => a - b);
  const correctOriginals = [...q.answers].sort((a, b) => a - b);
  const correct = selectedOriginals.length === correctOriginals.length && selectedOriginals.every((v, i) => v === correctOriginals[i]);
  if (correct) score++;
  answers[current] = { id:q.id, selectedOriginalIndices:selectedOriginals, correct };
  const wrongSet = getWrongSet();
  if (correct) wrongSet.delete(q.id); else wrongSet.add(q.id);
  saveWrongSet(wrongSet);
  document.querySelectorAll(".choice").forEach((btn, i) => {
    const originalIndex = q.shuffledChoices[i].originalIndex;
    btn.disabled = true;
    if (q.answers.includes(originalIndex)) btn.classList.add("correct");
    if (selected.includes(i) && !q.answers.includes(originalIndex)) btn.classList.add("wrong");
  });
  showFeedback(q, correct);
  $("nextBtn").disabled = false;
  updateStats();
}
function chooseText() {
  if (answered) return;
  const input = $("textAnswer");
  const value = input.value.trim();
  if (!value) return;
  answered = true;
  const q = session[current];
  const normalized = normalizeTextAnswer(value);
  const correct = q.textAnswers.some(answer => normalizeTextAnswer(answer) === normalized);
  if (correct) score++;
  answers[current] = { id:q.id, selectedText:value, correct };
  const wrongSet = getWrongSet();
  if (correct) wrongSet.delete(q.id); else wrongSet.add(q.id);
  saveWrongSet(wrongSet);
  input.disabled = true;
  input.classList.add(correct ? "correct" : "wrong");
  showFeedback(q, correct);
  $("submitTextBtn").disabled = true;
  $("nextBtn").disabled = false;
  updateStats();
}
function showFeedback(q, correct) {
  const fb = $("feedback");
  fb.className = "feedback " + (correct ? "good" : "bad");
  fb.innerHTML = `<h3>${correct ? "正解" : "不正解"}</h3>
    <p><b>正答：</b>${escapeHtml(getCorrectAnswerText(q))}</p>
    <p><b>解説：</b>${escapeHtml(q.explanation)}</p>`;
}
function toggleList() {
  const box = $("listBox");
  box.classList.toggle("hidden");
  if (!box.classList.contains("hidden")) {
    box.innerHTML = session.map((q, i) => `<button data-jump="${i}">${i + 1}. ${escapeHtml(q.question.slice(0, 55))}${q.question.length > 55 ? "..." : ""}</button>`).join("");
    box.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { current = parseInt(b.dataset.jump, 10); renderQuestion(); }));
  }
}
function finishQuiz() {
  const rate = session.length ? Math.round(score / session.length * 100) : 0;
  quizView.classList.add("hidden");
  resultView.classList.remove("hidden");
  const rows = session.map((q, i) => {
    const a = answers[i];
    const mark = a?.correct ? "○" : "×";
    const selected = a ? getSelectedAnswerText(q, a) : "未回答";
    return `<tr><td>${i + 1}</td><td>${escapeHtml(q.topic)}</td><td>${escapeHtml(q.question)}</td><td>${mark}</td><td>${escapeHtml(selected)}</td><td>${escapeHtml(getCorrectAnswerText(q))}</td></tr>`;
  }).join("");
  resultView.innerHTML = `
    <h2>結果：${score} / ${session.length}（${rate}%）</h2>
    <p class="small">間違えた問題は「苦手だけ」モードで復習できます。</p>
    <div class="row">
      <button class="btn-primary" onclick="startQuiz()">同じ条件でもう一度</button>
      <button class="btn-secondary" onclick="orderSelect.value='wrong'; startQuiz()">苦手だけ復習</button>
    </div>
    <table class="review-table"><thead><tr><th>#</th><th>分野</th><th>問題</th><th>判定</th><th>あなたの回答</th><th>正答</th></tr></thead><tbody>${rows}</tbody></table>
  `;
  updateStats();
}
function updateStats() {
  const done = answers.filter(Boolean).length;
  const rate = done ? Math.round(score / done * 100) : 0;
  $("scoreStat").textContent = rate + "%";
  $("doneStat").textContent = done;
  $("wrongStat").textContent = getWrongSet().size;
  const progress = session.length ? Math.round(done / session.length * 100) : 0;
  $("progressBar").style.width = progress + "%";
}
function getCorrectAnswerText(q) {
  if (q.type === "text") return q.textAnswers[0];
  if (q.type === "multi") return q.answers.map(i => q.choices[i]).join(" / ");
  return q.choices[q.answer];
}
function getSelectedAnswerText(q, a) {
  if (q.type === "text") return a.selectedText;
  if (q.type === "multi") return a.selectedOriginalIndices.map(i => q.choices[i]).join(" / ");
  return q.choices[a.selectedOriginalIndex];
}
function normalizeTextAnswer(str) {
  return String(str).trim().toLowerCase().replace(/\s+/g, " ");
}
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => {
    const map = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
    return map[s];
  });
}
$("startBtn").addEventListener("click", startQuiz);
$("resetBtn").addEventListener("click", () => {
  if (confirm("苦手記録をリセットしますか？")) {
    localStorage.removeItem(storeKey);
    updateStats();
  }
});
initTopics();
startQuiz();
</script>
